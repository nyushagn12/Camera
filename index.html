<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Camera</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:'Georgia',Serif,serif;display:flex;flex-direction:column;align-items:center;min-height:100vh;margin:0;padding:10px;background:#000;color:#fff}
#video{width:100%;max-height:50vh;background:#000;object-fit:contain}
.controls{margin-top:12px;display:flex;flex-wrap:wrap;justify-content:center;gap:8px}
.advanced-controls{margin-top:12px;display:grid;grid-template-columns:76px 92px 1fr;gap:10px;align-items:center;background:#000;padding:14px;border-radius:20px;border:1px solid #fff;max-width:92vw;width:100%}
.advanced-controls label{font-size:17px;font-weight:bold}
.advanced-controls .disabled-tag{font-size:14px;opacity:.45;font-style:italic;grid-column:2/4}
button,select,input[type="text"],input[type="password"],textarea{padding:9px 16px;font-size:17px;font-family:inherit;background:#000;color:#fff;border:1px solid #fff;border-radius:20px;cursor:pointer;transition:background .2s}
button:disabled,select:disabled,input[type="range"]:disabled{opacity:.3;cursor:not-allowed}
button.active{background:#fff;color:#000;font-weight:bold}
#camera-select{display:none}
input[type="range"]{width:100%;cursor:pointer;accent-color:#fff}
#canvas,#rec-canvas{display:none}

/* mode toggle */
#mode-toggle{display:flex;gap:0;border:1px solid #fff;border-radius:20px;overflow:hidden}
#mode-toggle button{border:none;border-radius:0;padding:9px 20px}
#mode-toggle button.active{background:#fff;color:#000}

/* record btn */
#capture-btn.recording{background:#c00;border-color:#f44;animation:pulse 1.2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.55}}
#rec-timer{font-size:22px;font-weight:bold;color:#f55;display:none;margin-top:8px;font-variant-numeric:tabular-nums}

/* video options */
#video-opts-row{display:none;margin-top:10px;justify-content:center}

/* ===== MODAL ===== */
#modal-overlay{position:fixed;inset:0;z-index:100;display:none;align-items:center;justify-content:center;flex-direction:column;background:rgba(0,0,0,.55);backdrop-filter:blur(28px) saturate(.35) brightness(.45);-webkit-backdrop-filter:blur(28px) saturate(.35) brightness(.45)}
#modal-overlay.open{display:flex}
#modal-frame{position:relative;line-height:0}
#modal-image,#modal-video{max-width:78vw;max-height:62vh;border-radius:10px;border:2px solid rgba(255,255,255,.85);display:block;background:#000;-webkit-touch-callout:default;-webkit-user-select:auto;user-select:auto;touch-action:manipulation}
#modal-image{width:70vw}
.modal-hint{text-align:center;font-size:13px;opacity:.55;margin-top:8px;font-style:italic;line-height:1.4}
.m-icon{position:absolute;width:46px;height:46px;background:rgba(0,0,0,.5);border:1px solid rgba(255,255,255,.75);border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);z-index:5;padding:0;transition:transform .15s}
.m-icon:active{transform:scale(.88)}
.m-icon svg{width:22px;height:22px;fill:none;stroke:#fff;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#ic-ai{top:10px;left:10px}#ic-presets{top:10px;right:10px}#ic-save{bottom:10px;left:10px}#ic-exit{bottom:10px;right:10px}
#ic-save.done{background:#fff}#ic-save.done svg{stroke:#000}

/* bottom sheet */
#sheet{position:fixed;bottom:0;left:0;right:0;background:rgba(8,8,8,.94);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-top:1px solid rgba(255,255,255,.25);border-radius:22px 22px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));max-height:58vh;overflow-y:auto;transform:translateY(105%);transition:transform .3s cubic-bezier(.32,.72,0,1);z-index:120;-webkit-overflow-scrolling:touch}
#sheet.open{transform:translateY(0)}
#sheet h3{margin:0 0 12px;font-size:17px;display:flex;justify-content:space-between;align-items:center}
#sheet .close-sheet{font-size:13px;opacity:.6;background:none;border:none;padding:4px 8px}
.preset-row{display:grid;grid-template-columns:118px 1fr 44px;align-items:center;gap:8px;margin-bottom:7px}
.preset-row label{font-size:13px}
.preset-row span{font-size:12px;opacity:.65;text-align:right;font-variant-numeric:tabular-nums}
.sec-title{font-size:12px;opacity:.5;margin:13px 0 5px;border-top:1px solid #2a2a2a;padding-top:9px;text-transform:uppercase;letter-spacing:1px}
#ai-prompt{width:100%;min-height:56px;resize:vertical;font-family:inherit;font-size:15px;border-radius:14px}
#ai-status{font-size:13px;opacity:.65;margin-top:8px;font-style:italic;min-height:18px}
.sheet-btns{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.sheet-btns button{flex:1;min-width:110px}
#preset-select{flex:1;font-size:15px}
.preset-bar{display:flex;gap:8px;margin-bottom:12px;align-items:center}
.preset-bar button{padding:8px 12px;font-size:13px}

/* gallery */
#gallery-section{width:100%;max-width:92vw;margin-top:28px}
#gallery-section h3{margin:0 0 10px;font-size:17px}
#gallery-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:7px}
.g-thumb{width:100%;aspect-ratio:1;object-fit:cover;border:1px solid #fff;border-radius:8px;cursor:pointer}
.g-thumb-vid{position:relative}
.g-thumb-vid::after{content:'▶';position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:22px;color:#fff;text-shadow:0 1px 4px #000;pointer-events:none}
.g-empty{opacity:.45;font-style:italic;font-size:13px}
.g-del{position:absolute;top:2px;right:2px;width:20px;height:20px;border-radius:50%;background:rgba(0,0,0,.7);border:1px solid #fff;color:#fff;font-size:11px;display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0}
.g-cell{position:relative}

/* settings */
#settings-btn{position:fixed;top:10px;right:10px;padding:6px 12px;font-size:14px;z-index:200}
#settings-panel{position:fixed;top:52px;right:10px;background:#000;border:1px solid #fff;border-radius:15px;padding:14px;width:272px;display:none;z-index:200}
#settings-panel label{display:block;font-size:12px;margin-bottom:3px;opacity:.75}
#settings-panel input,#settings-panel select{width:100%;margin-bottom:9px;font-size:14px}
</style>
</head>
<body>

<button id="settings-btn">⚙</button>
<div id="settings-panel">
  <label>OpenAI API key</label>
  <input type="password" id="api-key-input" placeholder="sk-..." autocomplete="off">
  <label>AI model</label>
  <select id="ai-model-select"><option value="gpt-image-1">gpt-image-1</option></select>
  <button id="save-settings-btn" style="width:100%">save</button>
  <button id="clear-gallery-btn" style="width:100%;margin-top:7px">clear gallery</button>
</div>

<video id="video" autoplay playsinline muted></video>
<div id="rec-timer">00:00</div>

<div class="controls">
  <div id="mode-toggle">
    <button id="mode-photo" class="active">photo</button>
    <button id="mode-video">video</button>
  </div>
</div>

<div class="controls">
  <button id="list-cameras-btn">switch modes</button>
  <select id="camera-select"></select>
  <button id="torch-btn" disabled>torch is OFF</button>
  <button id="capture-btn">capture</button>
</div>

<div id="video-opts-row" class="controls">
  <select id="video-opts"></select>
</div>

<div class="advanced-controls" id="advanced-panel">
  <label>focus</label>
  <select id="focus-mode" disabled><option value="continuous">auto</option><option value="manual">manual</option></select>
  <input type="range" id="focus-slider" disabled>

  <label>exposure</label>
  <select id="exposure-mode" disabled><option value="continuous">auto</option><option value="manual">manual</option></select>
  <input type="range" id="exposure-slider" disabled>

  <label>shutter</label>
  <select id="shutter-mode" disabled><option value="auto">auto</option><option value="manual">manual</option></select>
  <input type="range" id="shutter-slider" disabled>

  <label>ISO</label>
  <select id="iso-mode" disabled><option value="auto">auto</option><option value="manual">manual</option></select>
  <input type="range" id="iso-slider" disabled>
</div>

<canvas id="canvas"></canvas>
<canvas id="rec-canvas"></canvas>

<!-- ===== MODAL ===== -->
<div id="modal-overlay">
  <div id="modal-frame">
    <img id="modal-image" alt="" style="display:none">
    <video id="modal-video" playsinline controls style="display:none"></video>
    <button class="m-icon" id="ic-ai" title="Modify with AI"><svg viewBox="0 0 24 24"><path d="M12 3l1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9z"/><path d="M19 15l.9 2.1L22 18l-2.1.9L19 21l-.9-2.1L16 18l2.1-.9z"/></svg></button>
    <button class="m-icon" id="ic-presets" title="Presets"><svg viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 12h4M12 12h8M4 17h12M20 17h0"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="17" r="2"/></svg></button>
    <button class="m-icon" id="ic-save" title="Save"><svg viewBox="0 0 24 24"><path d="M12 3v12M7 10l5 5 5-5M4 20h16"/></svg></button>
    <button class="m-icon" id="ic-exit" title="Exit"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
  </div>
  <div class="modal-hint" id="modal-hint">hold the photo → "Add to Photos"</div>
</div>

<!-- ===== BOTTOM SHEET ===== -->
<div id="sheet">
  <!-- AI pane -->
  <div id="pane-ai" style="display:none">
    <h3>modify with AI <button class="close-sheet" data-close>✕ close</button></h3>
    <textarea id="ai-prompt" placeholder="what do we change? e.g. remove people, better lighting, golden hour, film look…"></textarea>
    <div class="sheet-btns"><button id="ai-submit-btn">send to AI</button></div>
    <div id="ai-status"></div>
  </div>
  <!-- Presets pane -->
  <div id="pane-presets" style="display:none">
    <h3>photographic presets <button class="close-sheet" data-close>✕ close</button></h3>
    <div class="preset-bar">
      <select id="preset-select"></select>
      <button id="preset-save-btn">＋ save</button>
      <button id="preset-del-btn">🗑</button>
    </div>
    <div id="preset-rows"></div>
    <div class="sheet-btns">
      <button id="apply-presets-btn">apply</button>
      <button id="reset-presets-btn">revert</button>
    </div>
  </div>
</div>

<!-- ===== GALLERY ===== -->
<section id="gallery-section">
  <h3>gallery <span id="gallery-count" class="g-empty"></span></h3>
  <div id="gallery-grid"></div>
</section>

<script>
/* ================= STATE ================= */
const $=id=>document.getElementById(id);
const video=$('video'),canvas=$('canvas'),recCanvas=$('rec-canvas');
const captureBtn=$('capture-btn'),listCamerasBtn=$('list-cameras-btn'),cameraSelect=$('camera-select'),torchBtn=$('torch-btn');
const focusMode=$('focus-mode'),focusSlider=$('focus-slider');
const exposureMode=$('exposure-mode'),exposureSlider=$('exposure-slider');
const shutterMode=$('shutter-mode'),shutterSlider=$('shutter-slider');
const isoMode=$('iso-mode'),isoSlider=$('iso-slider');
const advPanel=$('advanced-panel');
const modePhoto=$('mode-photo'),modeVideo=$('mode-video'),videoOptsRow=$('video-opts-row'),videoOpts=$('video-opts');
const recTimer=$('rec-timer');
const modalOverlay=$('modal-overlay'),modalFrame=$('modal-frame'),modalImage=$('modal-image'),modalVideo=$('modal-video'),modalHint=$('modal-hint');
const icAI=$('ic-ai'),icPresets=$('ic-presets'),icSave=$('ic-save'),icExit=$('ic-exit');
const sheet=$('sheet'),paneAI=$('pane-ai'),panePresets=$('pane-presets');
const aiPrompt=$('ai-prompt'),aiSubmitBtn=$('ai-submit-btn'),aiStatus=$('ai-status');
const presetSelect=$('preset-select'),presetSaveBtn=$('preset-save-btn'),presetDelBtn=$('preset-del-btn'),presetRows=$('preset-rows');
const applyPresetsBtn=$('apply-presets-btn'),resetPresetsBtn=$('reset-presets-btn');
const settingsBtn=$('settings-btn'),settingsPanel=$('settings-panel'),apiKeyInput=$('api-key-input'),aiModelSelect=$('ai-model-select'),saveSettingsBtn=$('save-settings-btn'),clearGalleryBtn=$('clear-gallery-btn');
const galleryGrid=$('gallery-grid'),galleryCount=$('gallery-count');

let currentStream=null,videoTrack=null,isTorchOn=false;
let mode='photo'; // 'photo'|'video'
let mediaRecorder=null,recordedChunks=[],recStartTime=0,recTimerInt=null,isRecording=false;
let modalBlobUrl=null,modalType='photo',modalBlob=null;
let baseImageData=null,originalBlobUrl=null;

/* hardware capability flags */
let hw={focus:false,exposure:false,shutter:false,iso:false,ois:false};
let softwareBrightness=1;
let simISO=160,simExposure=0,simShutter=0;

/* gyro stabilization */
let gyroBaseline=null,gyroTarget={x:0,y:0},gyroSmooth={x:0,y:0},gyroEnabled=false;
const CROP=0.92; // 8% total crop margin — "a tiny bit"

/* ================= INDEXEDDB ================= */
const DB_NAME='camera_gallery_v2',STORE='media';
let db=null;
function openDB(){return new Promise((res,rej)=>{const r=indexedDB.open(DB_NAME,1);r.onupgradeneeded=e=>{const d=e.target.result;if(!d.objectStoreNames.contains(STORE))d.createObjectStore(STORE,{keyPath:'id',autoIncrement:true})};r.onsuccess=e=>{db=e.target.result;res(db)};r.onerror=e=>rej(e.target.error)})}
function dbAdd(rec){return new Promise((res,rej)=>{const tx=db.transaction(STORE,'readwrite');tx.objectStore(STORE).add(rec);tx.oncomplete=()=>res();tx.onerror=e=>rej(e.target.error)})}
function dbAll(){return new Promise((res,rej)=>{const tx=db.transaction(STORE,'readonly');const r=tx.objectStore(STORE).getAll();r.onsuccess=()=>res(r.result);r.onerror=e=>rej(e.target.error)})}
function dbDel(id){return new Promise((res,rej)=>{const tx=db.transaction(STORE,'readwrite');tx.objectStore(STORE).delete(id);tx.oncomplete=()=>res();tx.onerror=e=>rej(e.target.error)})}
function dbClear(){return new Promise((res,rej)=>{const tx=db.transaction(STORE,'readwrite');tx.objectStore(STORE).clear();tx.oncomplete=()=>res();tx.onerror=e=>rej(e.target.error)})}

let thumbUrls=[];
async function renderGallery(){
  thumbUrls.forEach(u=>URL.revokeObjectURL(u));thumbUrls=[];
  const items=(await dbAll()).sort((a,b)=>b.ts-a.ts);
  galleryCount.textContent=items.length?`(${items.length})`:'';
  galleryGrid.innerHTML='';
  if(!items.length){galleryGrid.innerHTML='<div class="g-empty">no photos yet</div>';return}
  for(const it of items){
    const url=URL.createObjectURL(it.blob);thumbUrls.push(url);
    const cell=document.createElement('div');cell.className='g-cell';
    if(it.type==='photo'){
      const img=document.createElement('img');img.src=url;img.className='g-thumb';
      img.addEventListener('click',()=>openModalPhoto(it.blob));
      cell.appendChild(img);
    }else{
      const v=document.createElement('video');v.src=url;v.className='g-thumb';v.muted=true;v.preload='metadata';
      v.addEventListener('loadeddata',()=>{v.currentTime=Math.min(0.1,v.duration||0.1)});
      const wrap=document.createElement('div');wrap.className='g-thumb-vid';wrap.style.position='relative';
      wrap.appendChild(v);
      wrap.addEventListener('click',()=>openModalVideo(it.blob));
      cell.appendChild(wrap);
    }
    const del=document.createElement('button');del.className='g-del';del.textContent='✕';
    del.addEventListener('click',async e=>{e.stopPropagation();await dbDel(it.id);renderGallery()});
    cell.appendChild(del);
    galleryGrid.appendChild(cell);
  }
}

/* ================= SETTINGS ================= */
settingsBtn.addEventListener('click',()=>{
  const open=settingsPanel.style.display==='block';
  settingsPanel.style.display=open?'none':'block';
  if(!open){apiKeyInput.value=localStorage.getItem('openai_key')||'';aiModelSelect.value=localStorage.getItem('ai_model')||'gpt-image-1'}
});
saveSettingsBtn.addEventListener('click',()=>{
  localStorage.setItem('openai_key',apiKeyInput.value.trim());
  localStorage.setItem('ai_model',aiModelSelect.value);
  settingsPanel.style.display='none';
});
clearGalleryBtn.addEventListener('click',async()=>{if(confirm('wipe the whole gallery?')){await dbClear();renderGallery()}});

/* ================= CAMERA CORE ================= */
function stopMediaTracks(s){if(s)s.getTracks().forEach(t=>t.stop())}

function videoConstraintsFor(opts){
  const base={width:{ideal:999999},height:{ideal:999999},facingMode:'environment'};
  if(opts&&opts.fps)base.frameRate={ideal:opts.fps,max:opts.fps};
  if(opts&&opts.w)base.width={ideal:opts.w};
  if(opts&&opts.h)base.height={ideal:opts.h};
  return base;
}

function startCamera(deviceId=null,vidOpts=null){
  stopMediaTracks(currentStream);
  const constraints={audio:mode==='video',video:{...(deviceId?{deviceId:{exact:deviceId}}:videoConstraintsFor(vidOpts))}};
  if(deviceId)constraints.video.width={ideal:999999};
  navigator.mediaDevices.getUserMedia(constraints)
    .then(stream=>{
      currentStream=stream;video.srcObject=stream;
      videoTrack=stream.getVideoTracks()[0];
      setTimeout(()=>{setupAdvancedControls(videoTrack);buildVideoOptions()},600);
    })
    .catch(err=>{console.error('Camera error',err);alert('Camera failed: '+err.message)});
}

/* ================= ADVANCED CONTROLS + SILENT FALLBACKS ================= */
function setRowDisabled(label,rowEls,disabled,text){
  rowEls.forEach(el=>{if(el)el.style.display=disabled?'none':''});
}
function markDisabled(row,label){
  // replace select+slider with "Disabled" tag
  const sel=row.querySelector('select'),sl=row.querySelector('input[type=range]');
  let tag=row.querySelector('.disabled-tag');
  if(sel)sel.style.display='none';
  if(sl)sl.style.display='none';
  if(!tag){
    tag=document.createElement('span');tag.className='disabled-tag';tag.textContent='Disabled';
    row.appendChild(tag);
  }
  tag.style.display='';
}
function markEnabled(row){
  const sel=row.querySelector('select'),sl=row.querySelector('input[type=range]');
  const tag=row.querySelector('.disabled-tag');
  if(tag)tag.style.display='none';
  if(sel)sel.style.display='';
  if(sl)sl.style.display='';
}
const advRows=()=>[...advPanel.querySelectorAll('label')].map(l=>{
  // each label is followed by select + slider in the grid; wrap logically
  return l.parentElement;
});

function setupAdvancedControls(track){
  const caps=typeof track.getCapabilities==='function'?track.getCapabilities():{};
  const sets=typeof track.getSettings==='function'?track.getSettings():{};

  /* torch */
  if(caps.torch){torchBtn.disabled=false}else{torchBtn.disabled=true;isTorchOn=false;updateTorchUI()}

  /* OIS — enable if hardware exposes it (iOS keeps it on automatically; this is best-effort) */
  hw.ois=!!(caps.imageStabilization||caps.opticalImageStabilization);
  if(hw.ois){
    try{track.applyConstraints({advanced:[{imageStabilization:true}]})}catch(e){}
  }

  /* FOCUS — no simulation. Disabled means Disabled, said out loud. */
  const focusRow=focusMode.closest('.advanced-controls');
  if(caps.focusMode&&caps.focusMode.includes('manual')&&caps.focusDistance){
    hw.focus=true;focusMode.disabled=false;
    focusSlider.disabled=false;
    focusSlider.min=caps.focusDistance.min;focusSlider.max=caps.focusDistance.max;
    focusSlider.step=caps.focusDistance.step||0.01;
    focusSlider.value=sets.focusDistance||caps.focusDistance.min;
    focusMode.parentElement&&markEnabled(focusMode.parentElement);
    showFocusEnabled();
  }else{
    hw.focus=false;focusMode.disabled=true;focusSlider.disabled=true;
    showFocusDisabled();
  }

  /* EXPOSURE (compensation) — simulate with brightness if absent */
  if(caps.exposureCompensation){
    hw.exposure=true;
    exposureMode.disabled=false;exposureMode.innerHTML='<option value="continuous">auto</option><option value="manual">manual</option>';
    exposureSlider.min=caps.exposureCompensation.min;exposureSlider.max=caps.exposureCompensation.max;
    exposureSlider.step=caps.exposureCompensation.step||0.1;
    exposureSlider.value=sets.exposureCompensation||0;
    showRowEnabled(exposureMode);
  }else{
    hw.exposure=false;
    exposureMode.disabled=true;exposureMode.innerHTML='<option>simulated</option>';
    exposureSlider.min=-100;exposureSlider.max=100;exposureSlider.step=1;exposureSlider.value=0;
    exposureSlider.disabled=false; // silently live — controls brightness
    showRowSim(exposureMode);
  }

  /* SHUTTER — simulate with brightness if absent */
  if(caps.exposureTime&&caps.exposureMode&&caps.exposureMode.includes('manual')){
    hw.shutter=true;
    shutterMode.disabled=false;shutterMode.innerHTML='<option value="continuous">auto</option><option value="manual">manual</option>';
    shutterSlider.min=caps.exposureTime.min;shutterSlider.max=caps.exposureTime.max;
    shutterSlider.step=caps.exposureTime.step||1;
    shutterSlider.value=sets.exposureTime||caps.exposureTime.min;
    showRowEnabled(shutterMode);
  }else{
    hw.shutter=false;
    shutterMode.disabled=true;shutterMode.innerHTML='<option>simulated</option>';
    shutterSlider.min=-100;shutterSlider.max=100;shutterSlider.step=1;shutterSlider.value=0;
    shutterSlider.disabled=false;
    showRowSim(shutterMode);
  }

  /* ISO — default 160, simulate with brightness if absent */
  if(caps.iso){
    hw.iso=true;
    isoMode.disabled=false;isoMode.innerHTML='<option value="auto">auto</option><option value="manual">manual</option>';
    isoSlider.min=caps.iso.min;isoSlider.max=caps.iso.max;isoSlider.step=caps.iso.step||1;
    isoSlider.value=Math.max(caps.iso.min,Math.min(sets.iso||160,caps.iso.max));
    showRowEnabled(isoMode);
  }else{
    hw.iso=false;
    isoMode.disabled=true;isoMode.innerHTML='<option>simulated</option>';
    isoSlider.min=50;isoSlider.max=3200;isoSlider.step=10;isoSlider.value=160;
    isoSlider.disabled=false;
    showRowSim(isoMode);
  }
  recalcSoftwareBrightness();
}
function showFocusDisabled(){
  focusMode.style.display='none';focusSlider.style.display='none';
  let tag=$('focus-disabled-tag');
  if(!tag){tag=document.createElement('span');tag.id='focus-disabled-tag';tag.className='disabled-tag';tag.textContent='Disabled';focusSlider.after(tag)}
  tag.style.display='';
}
function showFocusEnabled(){
  focusMode.style.display='';focusSlider.style.display='';
  const tag=$('focus-disabled-tag');if(tag)tag.style.display='none';
}
function showRowEnabled(sel){
  sel.style.display='';
  const tag=sel.nextElementSibling&&sel.nextElementSibling.style&&(sel.parentElement.querySelector('.disabled-tag')||{}).style&&(sel.parentElement.querySelector('.disabled-tag')||{style:{}}).style.display='none';
  const tag=sel.parentElement.querySelector('.disabled-tag');if(tag)tag.style.display='none';
  sel.nextElementSibling.style.display='';

/* ================= VIDEO RECORDING + STABILIZATION ================= */
function getBestMime(){
  const c=['video/mp4;codecs=avc1.640028','video/mp4','video/webm;codecs=vp9','video/webm;codecs=vp8','video/webm'];
  for(const m of c)if(window.MediaRecorder&&MediaRecorder.isTypeSupported(m))return m;
  return '';
}

function startRecording(){
  if(!currentStream||!video.videoWidth)return;
  const vw=video.videoWidth,vh=video.videoHeight;
  const ow=Math.round(vw*CROP),oh=Math.round(vh*CROP);
  recCanvas.width=ow;recCanvas.height=oh;
  const rctx=recCanvas.getContext('2d');

  // gyro permission (iOS 13+)
  gyroBaseline=null;gyroTarget={x:0,y:0};gyroSmooth={x:0,y:0};
  if(typeof DeviceOrientationEvent!=='undefined'&&typeof DeviceOrientationEvent.requestPermission==='function'){
    DeviceOrientationEvent.requestPermission().then(s=>{
      if(s==='granted'){window.addEventListener('deviceorientation',onGyro);gyroEnabled=true}
    }).catch(()=>{});
  }else if(window.DeviceOrientationEvent){
    window.addEventListener('deviceorientation',onGyro);gyroEnabled=true;
  }

  const stream=recCanvas.captureStream(30);
  if(currentStream){currentStream.getAudioTracks().forEach(t=>stream.addTrack(t))}
  const mime=getBestMime();
  try{
    mediaRecorder=new MediaRecorder(stream,mime?{mimeType:mime,videoBitsPerSecond:14000000}:{videoBitsPerSecond:14000000});
  }catch(e){
    mediaRecorder=new MediaRecorder(stream);
  }
  recordedChunks=[];
  mediaRecorder.ondataavailable=e=>{if(e.data&&e.data.size)recordedChunks.push(e.data)};
  mediaRecorder.onstop=onRecordingStop;
  mediaRecorder.start(200);
  isRecording=true;
  captureBtn.classList.add('recording');captureBtn.textContent='■ stop';
  recStartTime=Date.now();recTimer.style.display='block';
  recTimerInt=setInterval(()=>{
    const s=Math.floor((Date.now()-recStartTime)/1000);
    recTimer.textContent=`${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`;
  },250);
  renderStabilizedFrame(rctx,vw,vh,ow,oh);
}

function onGyro(e){
  if(e.beta==null&&e.gamma==null)return;
  if(!gyroBaseline)gyroBaseline={beta:e.beta||0,gamma:e.gamma||0};
  const dBeta=(e.beta||0)-gyroBaseline.beta;
  const dGamma=(e.gamma||0)-gyroBaseline.gamma;
  const marginPx=(recCanvas.width*(1/CROP-1))/2;
  const pxPerDeg=marginPx/3.5; // ~3.5° max correction
  gyroTarget.x=Math.max(-marginPx,Math.min(marginPx,dGamma*pxPerDeg));
  gyroTarget.y=Math.max(-marginPx,Math.min(marginPx,(dBeta-0)*pxPerDeg*0.7));
}

function renderStabilizedFrame(rctx,vw,vh,ow,oh){
  if(!isRecording)return;
  gyroSmooth.x+=(gyroTarget.x-gyroSmooth.x)*0.12;
  gyroSmooth.y+=(gyroTarget.y-gyroSmooth.y)*0.12;
  const mx=(vw-ow)/2,my=(vh-oh)/2;
  let sx=mx-gyroSmooth.x,sy=my-gyroSmooth.y;
  sx=Math.max(0,Math.min(vw-ow,sx));
  sy=Math.max(0,Math.min(vh-oh,sy));
  if(softwareBrightness!==1)rctx.filter=`brightness(${softwareBrightness})`;
  rctx.drawImage(video,sx,sy,ow,oh,0,0,ow,oh);
  rctx.filter='none';
  requestAnimationFrame(()=>renderStabilizedFrame(rctx,vw,vh,ow,oh));
}

function stopRecording(){
  if(!mediaRecorder||mediaRecorder.state==='inactive')return;
  isRecording=false;
  mediaRecorder.stop();
  clearInterval(recTimerInt);recTimer.style.display='none';
  captureBtn.classList.remove('recording');captureBtn.textContent='● record';
  window.removeEventListener('deviceorientation',onGyro);gyroEnabled=false;
}

function onRecordingStop(){
  const type=mediaRecorder.mimeType||'video/mp4';
  const blob=new Blob(recordedChunks,{type});
  recordedChunks=[];
  if(modalBlobUrl)URL.revokeObjectURL(modalBlobUrl);
  modalBlob=blob;modalBlobUrl=URL.createObjectURL(blob);
  modalType='video';
  modalVideo.src=modalBlobUrl;modalVideo.style.display='block';
  modalImage.style.display='none';
  modalHint.textContent='tap save ↓ then share/export';
  icAI.style.display='none';icPresets.style.display='none';
  modalOverlay.classList.add('open');
  closeSheet();
  modalVideo.play().catch(()=>{});
}

const PRESET_DEFS=[

  {name:'Natural',builtin:true,values:{intensity:100,exposure:4.0,contrast:-4.0,saturation:-3.0,warmth:-6.5,gamma:0.5,wbGreenRed:-1.5,wbBlueYellow:4.5,highlightTone:-2.0,shadowTone:-0.5,sharpness:4.0,clarity:4.0,halation:0.0,grain:0}},

/* ================= IMAGE PROCESSING ================= */
function applyPresets(){
  if(!baseImageData){aiStatus.textContent='';return}
  const src=baseImageData;
  const out=new ImageData(new Uint8ClampedArray(src.data),src.width,src.height);
  const v=getPresetValues();
  const t=v.intensity/100;
  const d=out.data;
  const expMul=Math.pow(2,(v.exposure/100)*t);
  const conF=(v.contrast/100)*t+1;
  const satF=(v.saturation/100)*t+1;
  const wShift=(v.warmth/100)*40*t;
  const gr=(v.wbGreenRed/100)*30*t;
  const by=(v.wbBlueYellow/100)*30*t;
  const gammaExp=v.gamma===0?1:Math.pow(2,-(v.gamma/100)*t);
  const hiF=(v.highlightTone/100)*t;
  const shF=(v.shadowTone/100)*t;
  for(let i=0;i<d.length;i+=4){
    let r=d[i],g=d[i+1],b=d[i+2];
    r*=expMul;g*=expMul;b*=expMul;
    r=(r-128)*conF+128;g=(g-128)*conF+128;b=(b-128)*conF+128;
    r+=wShift;b-=wShift;
    g+=gr;r-=gr;
    b+=by;r-=by*0.5;g-=by*0.5;
    if(gammaExp!==1){
      r=Math.pow(Math.max(0,r)/255,gammaExp)*255;
      g=Math.pow(Math.max(0,g)/255,gammaExp)*255;
      b=Math.pow(Math.max(0,b)/255,gammaExp)*255;
    }
    const lum=0.299*r+0.587*g+0.114*b;
    r=lum+(r-lum)*satF;g=lum+(g-lum)*satF;b=lum+(b-lum)*satF;
    const lum2=0.299*r+0.587*g+0.114*b;
    if(lum2>180){const k=1+hiF*((lum2-180)/75);r=(r-180)*k+180;g=(g-180)*k+180;b=(b-180)*k+180}
    else if(lum2<70){const k=1+shF*((70-lum2)/70);r*=k;g*=k;b*=k}
    d[i]=Math.max(0,Math.min(255,r));d[i+1]=Math.max(0,Math.min(255,g));d[i+2]=Math.max(0,Math.min(255,b));
  }
  if(v.sharpness>0)unsharp(out,1,(v.sharpness/100)*t*1.5,false);
  if(v.clarity>0)unsharp(out,5,(v.clarity/100)*t*1.2,true);
  if(v.halation>0)halation(out,(v.halation/100)*t);
  if(v.grain>0)grain(out,(v.grain/100)*t);
  canvas.width=out.width;canvas.height=out.height;
  canvas.getContext('2d').putImageData(out,0,0);
  canvas.toBlob(blob=>{
    if(modalBlobUrl)URL.revokeObjectURL(modalBlobUrl);
    modalBlob=blob;modalBlobUrl=URL.createObjectURL(blob);
    modalImage.src=modalBlobUrl;
  },'image/png');
}
function boxBlur(src,w,h,r){
  const tmp=new Uint8ClampedArray(src.length),out=new Uint8ClampedArray(src.length);
  for(let y=0;y<h;y++)for(let x=0;x<w;x++){
    let rr=0,gg=0,bb=0,c=0;
    for(let k=-r;k<=r;k++){const nx=x+k;if(nx<0||nx>=w)continue;const i=(y*w+nx)*4;rr+=src[i];gg+=src[i+1];bb+=src[i+2];c++}
    const i=(y*w+x)*4;tmp[i]=rr/c;tmp[i+1]=gg/c;tmp[i+2]=bb/c;tmp[i+3]=src[i+3];
  }
  for(let y=0;y<h;y++)for(let x=0;x<w;x++){
    let rr=0,gg=0,bb=0,c=0;
    for(let k=-r;k<=r;k++){const ny=y+k;if(ny<0||ny>=h)continue;const i=(ny*w+x)*4;rr+=tmp[i];gg+=tmp[i+1];bb+=tmp[i+2];c++}
    const i=(y*w+x)*4;out[i]=rr/c;out[i+1]=gg/c;out[i+2]=bb/c;out[i+3]=tmp[i+3];
  }
  return out;
}
function unsharp(img,r,amount,midOnly){
  const w=img.width,h=img.height,src=new Uint8ClampedArray(img.data),d=img.data;
  const blur=boxBlur(src,w,h,r);
  for(let i=0;i<d.length;i+=4){
    const lum=(src[i]+src[i+1]+src[i+2])/3;
    let mask=1;
    if(midOnly)mask=1-Math.abs(lum-128)/128;
    for(let c=0;c<3;c++){
      const detail=src[i+c]-blur[i+c];
      d[i+c]=Math.max(0,Math.min(255,src[i+c]+detail*amount*mask));
    }
  }
}
function halation(img,amount){
  const w=img.width,h=img.height,src=new Uint8ClampedArray(img.data);
  const hi=new Uint8ClampedArray(src.length);
  for(let i=0;i<src.length;i+=4){
    const lum=(src[i]+src[i+1]+src[i+2])/3;
    if(lum>200){const k=(lum-200)/55;hi[i]=src[i]*k;hi[i+1]=src[i+1]*k;hi[i+2]=src[i+2]*k;hi[i+3]=255}
  }
  const blur=boxBlur(hi,w,h,6),d=img.data;
  for(let i=0;i<d.length;i+=4)for(let c=0;c<3;c++)d[i+c]=Math.max(0,Math.min(255,d[i+c]+blur[i+c]*amount*0.8));
}
function grain(img,amount){
  const d=img.data,inten=amount*50;
  for(let i=0;i<d.length;i+=4){
    const n=(Math.random()-0.5)*inten;
    d[i]=Math.max(0,Math.min(255,d[i]+n));
    d[i+1]=Math.max(0,Math.min(255,d[i+1]+n));
    d[i+2]=Math.max(0,Math.min(255,d[i+2]+n));
  }
}
applyPresetsBtn.addEventListener('click',applyPresets);
resetPresetsBtn.addEventListener('click',()=>{
  resetPresetsUI();
  if(originalBlobUrl){if(modalBlobUrl&&modalBlobUrl!==originalBlobUrl)URL.revokeObjectURL(modalBlobUrl);modalBlobUrl=originalBlobUrl;modalImage.src=modalBlobUrl}
});

/* ================= AI ================= */
aiSubmitBtn.addEventListener('click',async()=>{
  const apiKey=localStorage.getItem('openai_key');
  if(!apiKey){aiStatus.textContent='paste your OpenAI key in ⚙ first.';return}
  const prompt=aiPrompt.value.trim();
  if(!prompt){aiStatus.textContent='tell it what to change.';return}
  if(!modalBlob||modalType!=='photo'){aiStatus.textContent='photos only.';return}
  aiSubmitBtn.disabled=true;aiStatus.textContent='thinking… (5–20s)';
  try{
    const form=new FormData();
    form.append('image',modalBlob,'photo.png');
    form.append('prompt',prompt);
    form.append('model',aiModelSelect.value||'gpt-image-1');
    form.append('size','auto');
    const resp=await fetch('https://api.openai.com/v1/images/edits',{method:'POST',headers:{'Authorization':`Bearer ${apiKey}`},body:form});
    const data=await resp.json();
    if(!resp.ok)throw new Error(data.error?.message||('HTTP '+resp.status));
    const b64=data.data&&data.data[0]&&data.data[0].b64_json;
    if(!b64)throw new Error('empty response');
    const bin=atob(b64);const arr=new Uint8Array(bin.length);
    for(let i=0;i<bin.length;i++)arr[i]=bin.charCodeAt(i);
    const blob=new Blob([arr],{type:'image/png'});
    if(modalBlobUrl)URL.revokeObjectURL(modalBlobUrl);
    modalBlob=blob;modalBlobUrl=URL.createObjectURL(blob);
    modalImage.src=modalBlobUrl;
    // refresh base for presets on the AI result
    const img=new Image();img.onload=()=>{canvas.width=img.naturalWidth;canvas.height=img.naturalHeight;const c2=canvas.getContext('2d');c2.drawImage(img,0,0);baseImageData=c2.getImageData(0,0,canvas.width,canvas.height)};img.src=modalBlobUrl;
    aiStatus.textContent='done. hold to save, or keep editing.';
  }catch(err){
    console.error(err);aiStatus.textContent='error: '+err.message;
  }finally{aiSubmitBtn.disabled=false}
});

/* ================= CAMERA LIST ================= */
listCamerasBtn.addEventListener('click',async()=>{
  try{
    const devs=await navigator.mediaDevices.enumerateDevices();
    const vids=devs.filter(d=>d.kind==='videoinput');
    cameraSelect.innerHTML='';
    vids.forEach((d,i)=>{const o=document.createElement('option');o.value=d.deviceId;o.text=d.label||`Camera ${i+1}`;cameraSelect.appendChild(o)});
    cameraSelect.style.display='block';listCamerasBtn.style.display='none';
  }catch(e){console.error(e);alert('Could not list cameras')}
});
cameraSelect.addEventListener('change',e=>{
  startCamera(e.target.value,mode==='video'?{fps:30}:null);
  isTorchOn=false;updateTorchUI();
});

/* ================= INIT ================= */
buildPresetRows();
refreshPresetSelect();
(async()=>{await openDB();renderGallery()})();
startCamera();
</script>
