<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Camera</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;outline:none}
body{font-family:'SF Mono','Fira Code','Cascadia Code','JetBrains Mono',Consolas,Monaco,monospace;display:flex;flex-direction:column;align-items:center;min-height:100vh;margin:0;padding:10px;background:#000;color:#fff}
#video{width:100%;max-height:50vh;background:#000;object-fit:contain}
.controls{margin-top:12px;display:flex;flex-wrap:wrap;justify-content:center;gap:8px}
.advanced-controls{margin-top:12px;display:grid;grid-template-columns:76px 92px 1fr;gap:10px;align-items:center;background:#0a0a0a;padding:14px;border-radius:16px;max-width:92vw;width:100%}
.advanced-controls label{font-size:14px;font-weight:bold}
.advanced-controls .disabled-tag{font-size:13px;opacity:.4;font-style:italic;grid-column:2/4}
button,select,input[type="text"],input[type="password"],textarea{padding:9px 16px;font-size:15px;font-family:inherit;background:#1a1a1a;color:#fff;border:none;border-radius:14px;cursor:pointer;transition:background .15s}
button:active{background:#333}
button:disabled,select:disabled,input[type="range"]:disabled{opacity:.3;cursor:not-allowed}
button.active{background:#fff;color:#000;font-weight:bold}
#camera-select{display:none}
input[type="range"]{width:100%;cursor:pointer;accent-color:#fff}
#canvas,#rec-canvas{display:none}
#mode-toggle{display:flex;gap:0;background:#1a1a1a;border-radius:14px;overflow:hidden}
#mode-toggle button{border:none;border-radius:0;padding:9px 20px}
#mode-toggle button.active{background:#fff;color:#000}
#capture-btn.recording{background:#c00;animation:pulse 1.2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.55}}
#rec-timer{font-size:20px;font-weight:bold;color:#f55;display:none;margin-top:8px;font-variant-numeric:tabular-nums}
#video-opts-row{display:none;margin-top:10px;justify-content:center}

#modal-overlay{position:fixed;inset:0;z-index:100;display:none;align-items:center;justify-content:center;flex-direction:column;background:rgba(0,0,0,.55);backdrop-filter:blur(28px) saturate(.35) brightness(.45);-webkit-backdrop-filter:blur(28px) saturate(.35) brightness(.45)}
#modal-overlay.open{display:flex}
#modal-frame{position:relative;line-height:0}
#modal-image,#modal-video{max-width:78vw;max-height:62vh;border-radius:10px;display:block;background:#000;-webkit-touch-callout:default;-webkit-user-select:auto;user-select:auto;touch-action:manipulation}
#modal-image{width:70vw}
.modal-hint{text-align:center;font-size:12px;opacity:.5;margin-top:8px;font-style:italic;line-height:1.4}
.m-icon{position:absolute;width:44px;height:44px;background:rgba(20,20,20,.7);border:none;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);z-index:5;padding:0;transition:transform .12s}
.m-icon:active{transform:scale(.88)}
.m-icon svg{width:20px;height:20px;fill:none;stroke:#fff;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#ic-ai{top:10px;left:10px}#ic-presets{top:10px;right:10px}#ic-save{bottom:10px;left:10px}#ic-exit{bottom:10px;right:10px}
#ic-save.done{background:#fff}#ic-save.done svg{stroke:#000}

#sheet{position:fixed;bottom:0;left:0;right:0;background:rgba(10,10,10,.95);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-radius:20px 20px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));max-height:58vh;overflow-y:auto;transform:translateY(105%);transition:transform .3s cubic-bezier(.32,.72,0,1);z-index:120;-webkit-overflow-scrolling:touch}
#sheet.open{transform:translateY(0)}
#sheet h3{margin:0 0 12px;font-size:15px;display:flex;justify-content:space-between;align-items:center}
#sheet .close-sheet{font-size:12px;opacity:.6;background:none;border:none;padding:4px 8px}
.preset-row{display:grid;grid-template-columns:118px 1fr 44px;align-items:center;gap:8px;margin-bottom:7px}
.preset-row label{font-size:12px}
.preset-row span{font-size:11px;opacity:.6;text-align:right;font-variant-numeric:tabular-nums}
.sec-title{font-size:11px;opacity:.45;margin:13px 0 5px;padding-top:9px;text-transform:uppercase;letter-spacing:1px}
#ai-prompt{width:100%;min-height:56px;resize:vertical;font-family:inherit;font-size:14px;border-radius:12px;background:#1a1a1a;border:none}
#ai-status{font-size:12px;opacity:.6;margin-top:8px;font-style:italic;min-height:16px}
.sheet-btns{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.sheet-btns button{flex:1;min-width:100px}
#preset-select{flex:1;font-size:14px}
.preset-bar{display:flex;gap:8px;margin-bottom:12px;align-items:center}
.preset-bar button{padding:8px 12px;font-size:12px}

#gallery-section{width:100%;max-width:92vw;margin-top:28px}
#gallery-section h3{margin:0 0 10px;font-size:15px}
#gallery-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:7px}
.g-thumb{width:100%;aspect-ratio:1;object-fit:cover;border-radius:8px;cursor:pointer}
.g-thumb-vid{position:relative}
.g-thumb-vid::after{content:'▶';position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:20px;color:#fff;text-shadow:0 1px 4px #000;pointer-events:none}
.g-empty{opacity:.4;font-style:italic;font-size:12px}
.g-del{position:absolute;top:2px;right:2px;width:20px;height:20px;border-radius:50%;background:rgba(0,0,0,.7);border:none;color:#fff;font-size:11px;display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0}
.g-cell{position:relative}

#settings-btn{position:fixed;top:10px;right:10px;padding:6px 12px;font-size:13px;z-index:200}
#settings-panel{position:fixed;top:50px;right:10px;background:#111;border-radius:14px;padding:14px;width:272px;display:none;z-index:200}
#settings-panel label{display:block;font-size:11px;margin-bottom:3px;opacity:.7}
#settings-panel input,#settings-panel select{width:100%;margin-bottom:9px;font-size:13px}
</style>
</head>
<body>

<button id="settings-btn">⚙</button>
<div id="settings-panel">
  <label>OpenAI API key</label>
  <input type="password" id="api-key-input" placeholder="sk-..." autocomplete="off">
  <label>AI model</label>
  <select id="ai-model-select"><option value="gpt-image-1">gpt-image-1</option></select>
  <button id="save-settings-btn" style="width:100%">save</button>
  <button id="clear-gallery-btn" style="width:100%;margin-top:7px">clear gallery</button>
</div>

<video id="video" autoplay playsinline muted></video>
<div id="rec-timer">00:00</div>

<div class="controls">
  <div id="mode-toggle">
    <button id="mode-photo" class="active">photo</button>
    <button id="mode-video">video</button>
  </div>
</div>

<div class="controls">
  <button id="list-cameras-btn">switch modes</button>
  <select id="camera-select"></select>
  <button id="torch-btn" disabled>torch is OFF</button>
  <button id="capture-btn">capture</button>
</div>

<div id="video-opts-row" class="controls">
  <select id="video-opts"></select>
</div>

<div class="advanced-controls" id="advanced-panel">
  <label>focus</label>
  <select id="focus-mode" disabled><option value="continuous">auto</option><option value="manual">manual</option></select>
  <input type="range" id="focus-slider" disabled>

  <label>exposure</label>
  <select id="exposure-mode" disabled><option value="continuous">auto</option><option value="manual">manual</option></select>
  <input type="range" id="exposure-slider" disabled>

  <label>shutter</label>
  <select id="shutter-mode" disabled><option value="auto">auto</option><option value="manual">manual</option></select>
  <input type="range" id="shutter-slider" disabled>

  <label>ISO</label>
  <select id="iso-mode" disabled><option value="auto">auto</option><option value="manual">manual</option></select>
  <input type="range" id="iso-slider" disabled>
</div>

<canvas id="canvas"></canvas>
<canvas id="rec-canvas"></canvas>

<div id="modal-overlay">
  <div id="modal-frame">
    <img id="modal-image" alt="" style="display:none">
    <video id="modal-video" playsinline controls style="display:none"></video>
    <button class="m-icon" id="ic-ai" title="AI"><svg viewBox="0 0 24 24"><path d="M12 3l1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9z"/><path d="M19 15l.9 2.1L22 18l-2.1.9L19 21l-.9-2.1L16 18l2.1-.9z"/></svg></button>
    <button class="m-icon" id="ic-presets" title="Presets"><svg viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 12h4M12 12h8M4 17h12M20 17h0"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="17" r="2"/></svg></button>
    <button class="m-icon" id="ic-save" title="Save"><svg viewBox="0 0 24 24"><path d="M12 3v12M7 10l5 5 5-5M4 20h16"/></svg></button>
    <button class="m-icon" id="ic-exit" title="Exit"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
  </div>
  <div class="modal-hint" id="modal-hint">hold photo → Add to Photos</div>
</div>

<div id="sheet">
  <div id="pane-ai" style="display:none">
    <h3>modify with AI <button class="close-sheet" data-close>✕</button></h3>
    <textarea id="ai-prompt" placeholder="what do we change? remove people, better lighting, golden hour…"></textarea>
    <div class="sheet-btns"><button id="ai-submit-btn">send to AI</button></div>
    <div id="ai-status"></div>
  </div>
  <div id="pane-presets" style="display:none">
    <h3>presets <button class="close-sheet" data-close>✕</button></h3>
    <div class="preset-bar">
      <select id="preset-select"></select>
      <button id="preset-save-btn">＋ save</button>
      <button id="preset-del-btn">🗑</button>
    </div>
    <div id="preset-rows"></div>
    <div class="sheet-btns">
      <button id="apply-presets-btn">apply</button>
      <button id="reset-presets-btn">revert</button>
    </div>
  </div>
</div>

<section id="gallery-section">
  <h3>gallery <span id="gallery-count" class="g-empty"></span></h3>
  <div id="gallery-grid"></div>
</section>

<script>
const $=id=>document.getElementById(id);
const video=$('video'),canvas=$('canvas'),recCanvas=$('rec-canvas');
const captureBtn=$('capture-btn'),listCamerasBtn=$('list-cameras-btn'),cameraSelect=$('camera-select'),torchBtn=$('torch-btn');
const focusMode=$('focus-mode'),focusSlider=$('focus-slider');
const exposureMode=$('exposure-mode'),exposureSlider=$('exposure-slider');
const shutterMode=$('shutter-mode'),shutterSlider=$('shutter-slider');
const isoMode=$('iso-mode'),isoSlider=$('iso-slider');
const modePhoto=$('mode-photo'),modeVideo=$('mode-video'),videoOptsRow=$('video-opts-row'),videoOpts=$('video-opts');
const recTimer=$('rec-timer');
const modalOverlay=$('modal-overlay'),modalImage=$('modal-image'),modalVideo=$('modal-video'),modalHint=$('modal-hint');
const icAI=$('ic-ai'),icPresets=$('ic-presets'),icSave=$('ic-save'),icExit=$('ic-exit');
const sheet=$('sheet'),paneAI=$('pane-ai'),panePresets=$('pane-presets');
const aiPrompt=$('ai-prompt'),aiSubmitBtn=$('ai-submit-btn'),aiStatus=$('ai-status');
const presetSelect=$('preset-select'),presetSaveBtn=$('preset-save-btn'),presetDelBtn=$('preset-del-btn'),presetRows=$('preset-rows');
const applyPresetsBtn=$('apply-presets-btn'),resetPresetsBtn=$('reset-presets-btn');
const settingsBtn=$('settings-btn'),settingsPanel=$('settings-panel'),apiKeyInput=$('api-key-input'),aiModelSelect=$('ai-model-select'),saveSettingsBtn=$('save-settings-btn'),clearGalleryBtn=$('clear-gallery-btn');
const galleryGrid=$('gallery-grid'),galleryCount=$('gallery-count');

let currentStream=null,videoTrack=null,isTorchOn=false;
let mode='photo';
let mediaRecorder=null,recordedChunks=[],isRecording=false,recInterval=null,recStartTime=0,recTimerInt=null;
let modalBlobUrl=null,modalType='photo',modalBlob=null;
let baseImageData=null,originalBlobUrl=null;
let hw={focus:false,exposure:false,shutter:false,iso:false};
let softwareBrightness=1;

/* ===== INDEXEDDB ===== */
const DB_NAME='cam_v3',STORE='media';
let db=null;
function openDB(){return new Promise((res,rej)=>{const r=indexedDB.open(DB_NAME,1);r.onupgradeneeded=e=>{const d=e.target.result;if(!d.objectStoreNames.contains(STORE))d.createObjectStore(STORE,{keyPath:'id',autoIncrement:true})};r.onsuccess=e=>{db=e.target.result;res(db)};r.onerror=e=>rej(e.target.error)})}
function dbAdd(rec){return new Promise((res,rej)=>{const tx=db.transaction(STORE,'readwrite');tx.objectStore(STORE).add(rec);tx.oncomplete=()=>res();tx.onerror=e=>rej(e.target.error)})}
function dbAll(){return new Promise((res,rej)=>{const tx=db.transaction(STORE,'readonly');const r=tx.objectStore(STORE).getAll();r.onsuccess=()=>res(r.result);r.onerror=e=>rej(e.target.error)})}
function dbDel(id){return new Promise((res,rej)=>{const tx=db.transaction(STORE,'readwrite');tx.objectStore(STORE).delete(id);tx.oncomplete=()=>res();tx.onerror=e=>rej(e.target.error)})}
function dbClear(){return new Promise((res,rej)=>{const tx=db.transaction(STORE,'readwrite');tx.objectStore(STORE).clear();tx.oncomplete=()=>res();tx.onerror=e=>rej(e.target.error)})}

let thumbUrls=[];
async function renderGallery(){
  thumbUrls.forEach(u=>URL.revokeObjectURL(u));thumbUrls=[];
  const items=(await dbAll()).sort((a,b)=>b.ts-a.ts);
  galleryCount.textContent=items.length?'('+items.length+')':'';
  galleryGrid.innerHTML='';
  if(!items.length){galleryGrid.innerHTML='<div class="g-empty">no photos yet</div>';return}
  for(const it of items){
    const url=URL.createObjectURL(it.blob);thumbUrls.push(url);
    const cell=document.createElement('div');cell.className='g-cell';
    if(it.type==='photo'){
      const img=document.createElement('img');img.src=url;img.className='g-thumb';
      img.addEventListener('click',()=>openModalPhoto(it.blob));
      cell.appendChild(img);
    }else{
      const wrap=document.createElement('div');wrap.className='g-thumb-vid';wrap.style.position='relative';
      const v=document.createElement('video');v.src=url;v.className='g-thumb';v.muted=true;v.preload='metadata';
      v.addEventListener('loadeddata',()=>{v.currentTime=0.1});
      wrap.appendChild(v);
      wrap.addEventListener('click',()=>openModalVideo(it.blob));
      cell.appendChild(wrap);
    }
    const del=document.createElement('button');del.className='g-del';del.textContent='✕';
    del.addEventListener('click',async e=>{e.stopPropagation();await dbDel(it.id);renderGallery()});
    cell.appendChild(del);
    galleryGrid.appendChild(cell);
  }
}

/* ===== SETTINGS ===== */
settingsBtn.addEventListener('click',()=>{
  const open=settingsPanel.style.display==='block';
  settingsPanel.style.display=open?'none':'block';
  if(!open){apiKeyInput.value=localStorage.getItem('openai_key')||'';aiModelSelect.value=localStorage.getItem('ai_model')||'gpt-image-1'}
});
saveSettingsBtn.addEventListener('click',()=>{
  localStorage.setItem('openai_key',apiKeyInput.value.trim());
  localStorage.setItem('ai_model',aiModelSelect.value);
  settingsPanel.style.display='none';
});
clearGalleryBtn.addEventListener('click',async()=>{if(confirm('wipe gallery?')){await dbClear();renderGallery()}});

/* ===== CAMERA ===== */
function stopTracks(s){if(s)s.getTracks().forEach(t=>t.stop())}
function startCamera(deviceId,vidOpts){
  stopTracks(currentStream);
  const vc=deviceId?{deviceId:{exact:deviceId},width:{ideal:999999},height:{ideal:999999}}:{facingMode:'environment',width:{ideal:999999},height:{ideal:999999}};
  if(vidOpts&&vidOpts.fps)vc.frameRate={ideal:vidOpts.fps};
  if(vidOpts&&vidOpts.w){vc.width={ideal:vidOpts.w};vc.height={ideal:vidOpts.h}}
  const constraints={audio:mode==='video',video:vc};
  navigator.mediaDevices.getUserMedia(constraints).then(stream=>{
    currentStream=stream;video.srcObject=stream;
    videoTrack=stream.getVideoTracks()[0];
    setTimeout(()=>{setupAdvanced(videoTrack);buildVideoOptions()},600);
  }).catch(e=>{console.error(e);alert('Camera failed: '+e.message)});
}

/* ===== ADVANCED CONTROLS ===== */
function setupAdvanced(track){
  const caps=track.getCapabilities?track.getCapabilities():{};
  const sets=track.getSettings?track.getSettings():{};
  if(caps.torch){torchBtn.disabled=false}else{torchBtn.disabled=true;isTorchOn=false;updateTorchUI()}
  if(hw.ois=!!(caps.imageStabilization)){try{track.applyConstraints({advanced:[{imageStabilization:true}]})}catch(e){}}

  if(caps.focusMode&&caps.focusMode.includes('manual')&&caps.focusDistance){
    hw.focus=true;focusMode.disabled=false;focusSlider.disabled=false;
    focusSlider.min=caps.focusDistance.min;focusSlider.max=caps.focusDistance.max;
    focusSlider.step=caps.focusDistance.step||0.01;focusSlider.value=sets.focusDistance||caps.focusDistance.min;
    showFocusEnabled();
  }else{hw.focus=false;focusMode.disabled=true;focusSlider.disabled=true;showFocusDisabled()}

  if(caps.exposureCompensation){
    hw.exposure=true;exposureMode.disabled=false;
    exposureMode.innerHTML='<option value="continuous">auto</option><option value="manual">manual</option>';
    exposureSlider.min=caps.exposureCompensation.min;exposureSlider.max=caps.exposureCompensation.max;
    exposureSlider.step=caps.exposureCompensation.step||0.1;exposureSlider.value=sets.exposureCompensation||0;
    showRowEnabled(exposureMode);
  }else{
    hw.exposure=false;exposureMode.disabled=true;exposureMode.innerHTML='<option>sim</option>';
    exposureSlider.min=-100;exposureSlider.max=100;exposureSlider.step=1;exposureSlider.value=0;
    showRowSim(exposureMode);
  }

  if(caps.exposureTime&&caps.exposureMode&&caps.exposureMode.includes('manual')){
    hw.shutter=true;shutterMode.disabled=false;
    shutterMode.innerHTML='<option value="continuous">auto</option><option value="manual">manual</option>';
    shutterSlider.min=caps.exposureTime.min;shutterSlider.max=caps.exposureTime.max;
    shutterSlider.step=caps.exposureTime.step||1;shutterSlider.value=sets.exposureTime||caps.exposureTime.min;
    showRowEnabled(shutterMode);
  }else{
    hw.shutter=false;shutterMode.disabled=true;shutterMode.innerHTML='<option>sim</option>';
    shutterSlider.min=-100;shutterSlider.max=100;shutterSlider.step=1;shutterSlider.value=0;
    showRowSim(shutterMode);
  }

  if(caps.iso){
    hw.iso=true;isoMode.disabled=false;
    isoMode.innerHTML='<option value="auto">auto</option><option value="manual">manual</option>';
    isoSlider.min=caps.iso.min;isoSlider.max=caps.iso.max;isoSlider.step=caps.iso.step||1;
    isoSlider.value=Math.max(caps.iso.min,Math.min(sets.iso||160,caps.iso.max));
    showRowEnabled(isoMode);
  }else{
    hw.iso=false;isoMode.disabled=true;isoMode.innerHTML='<option>sim</option>';
    isoSlider.min=50;isoSlider.max=3200;isoSlider.step=10;isoSlider.value=160;
    showRowSim(isoMode);
  }
  recalcBrightness();
}
function showFocusDisabled(){
  focusMode.style.display='none';focusSlider.style.display='none';
  let tag=$('focus-disabled-tag');
  if(!tag){tag=document.createElement('span');tag.id='focus-disabled-tag';tag.className='disabled-tag';tag.textContent='Disabled';focusSlider.after(tag)}
  tag.style.display='';
}
function showFocusEnabled(){
  focusMode.style.display='';focusSlider.style.display='';
  var tag=$('focus-disabled-tag');if(tag)tag.style.display='none';
}
function showRowEnabled(sel){
  sel.style.display='';
  var tag=sel.parentElement.querySelector('.disabled-tag');
  if(tag)tag.style.display='none';
  var sib=sel.nextElementSibling;
  if(sib)sib.style.display='';
}
function showRowSim(sel){
  sel.style.display='none';
  var tag=sel.parentElement.querySelector('.disabled-tag');
  if(tag)tag.style.display='none';
  var sib=sel.nextElementSibling;
  if(sib){sib.style.display='';sib.disabled=false}
}
function recalcBrightness(){
  let b=1;
  if(!hw.iso)b*=(parseFloat(isoSlider.value)||160)/160;
  if(!hw.exposure)b*=Math.pow(2,(parseFloat(exposureSlider.value)||0)/100);
  if(!hw.shutter)b*=Math.pow(2,(parseFloat(shutterSlider.value)||0)/100);
  softwareBrightness=b;
}
async function applySettings(){
  if(!videoTrack)return;
  const adv={};
  if(!torchBtn.disabled)adv.torch=isTorchOn;
  if(hw.focus){adv.focusMode=focusMode.value;if(focusMode.value==='manual')adv.focusDistance=parseFloat(focusSlider.value)}
  if(hw.exposure&&exposureMode.value==='manual')adv.exposureCompensation=parseFloat(exposureSlider.value);
  if(hw.shutter){adv.exposureMode=shutterMode.value;if(shutterMode.value==='manual')adv.exposureTime=parseFloat(shutterSlider.value)}
  if(hw.iso&&isoMode.value==='manual')adv.iso=parseFloat(isoSlider.value);
  if(Object.keys(adv).length){try{await videoTrack.applyConstraints({advanced:[adv]})}catch(e){}}
  recalcBrightness();
}
function updateTorchUI(){torchBtn.innerText='torch: '+(isTorchOn?'ON':'OFF');torchBtn.classList.toggle('active',isTorchOn)}
torchBtn.addEventListener('click',()=>{isTorchOn=!isTorchOn;updateTorchUI();applySettings()});
[focusMode,exposureMode,shutterMode,isoMode].forEach(el=>el.addEventListener('change',applySettings));
[focusSlider,exposureSlider,shutterSlider,isoSlider].forEach(el=>el.addEventListener('input',()=>{recalcBrightness();applySettings()}));

/* ===== VIDEO OPTIONS ===== */
function buildVideoOptions(){
  if(!videoTrack)return;
  const caps=videoTrack.getCapabilities?videoTrack.getCapabilities():{};
  const maxFPS=(caps.frameRate&&caps.frameRate.max)||30;
  const maxW=(caps.width&&caps.width.max)||1920;
  videoOpts.innerHTML='';
  const add=(l,v)=>{const o=document.createElement('option');o.value=v;o.textContent=l;videoOpts.appendChild(o)};
  add('Open Gate HD 30fps','og30');
  if(maxFPS>=60)add('HD 60fps','hd60');
  if(maxFPS>=120)add('HD 120fps','hd120');
  if(maxFPS>=240)add('HD 240fps','hd240');
  if(maxW>=3840)add('4K 30fps','4k30');
  if(maxW>=3840&&maxFPS>=60)add('4K 60fps','4k60');
}
videoOpts.addEventListener('change',()=>{
  const map={og30:{fps:30},hd60:{fps:60},hd120:{fps:120},hd240:{fps:240},'4k30':{fps:30,w:3840,h:2160},'4k60':{fps:60,w:3840,h:2160}};
  startCamera(cameraSelect.value||null,map[videoOpts.value]||{fps:30});

/* ===== PHOTO ===== */
const CROP=0.92;
captureBtn.addEventListener('click',()=>{
  if(mode==='photo')capturePhoto();
  else isRecording?stopRecording():startRecording();
});
function capturePhoto(){
  if(!video.videoWidth)return;
  const vw=video.videoWidth,vh=video.videoHeight;
  const ow=Math.round(vw*CROP),oh=Math.round(vh*CROP);
  const mx=(vw-ow)/2,my=(vh-oh)/2;
  canvas.width=ow;canvas.height=oh;
  const ctx=canvas.getContext('2d');
  if(softwareBrightness!==1)ctx.filter='brightness('+softwareBrightness+')';
  ctx.drawImage(video,mx,my,ow,oh,0,0,ow,oh);
  ctx.filter='none';
  baseImageData=ctx.getImageData(0,0,ow,oh);
  canvas.toBlob(blob=>{
    if(modalBlobUrl)URL.revokeObjectURL(modalBlobUrl);
    modalBlob=blob;modalBlobUrl=URL.createObjectURL(blob);originalBlobUrl=modalBlobUrl;
    modalType='photo';
    modalImage.src=modalBlobUrl;modalImage.style.display='block';
    modalVideo.style.display='none';modalVideo.pause();
    modalHint.textContent='hold photo → Add to Photos';modalHint.style.display='';
    icAI.style.display='';icPresets.style.display='';
    modalOverlay.classList.add('open');
    resetPresetsUI();closeSheet();
  },'image/png');
}

/* ===== VIDEO RECORDING ===== */
let gyroBaseline=null,gyroTarget={x:0,y:0},gyroSmooth={x:0,y:0};
function getBestMime(){
  var types=['video/mp4;codecs=avc1.42E01E','video/mp4','video/webm;codecs=vp9','video/webm;codecs=vp8','video/webm'];
  for(var i=0;i<types.length;i++){
    if(window.MediaRecorder&&MediaRecorder.isTypeSupported(types[i]))return types[i];
  }
  return '';
}
function onGyro(e){
  if(e.beta==null&&e.gamma==null)return;
  if(!gyroBaseline)gyroBaseline={beta:e.beta||0,gamma:e.gamma||0};
  var dBeta=(e.beta||0)-gyroBaseline.beta;
  var dGamma=(e.gamma||0)-gyroBaseline.gamma;
  var margin=(recCanvas.width*(1/CROP-1))/2;
  var pxPerDeg=margin/3.5;
  gyroTarget.x=Math.max(-margin,Math.min(margin,dGamma*pxPerDeg));
  gyroTarget.y=Math.max(-margin,Math.min(margin,dBeta*pxPerDeg*0.7));
}
function drawRecFrame(rctx,vw,vh,ow,oh){
  gyroSmooth.x+=(gyroTarget.x-gyroSmooth.x)*0.12;
  gyroSmooth.y+=(gyroTarget.y-gyroSmooth.y)*0.12;
  var mx=(vw-ow)/2,my=(vh-oh)/2;
  var sx=Math.max(0,Math.min(vw-ow,mx-gyroSmooth.x));
  var sy=Math.max(0,Math.min(vh-oh,my-gyroSmooth.y));
  rctx.drawImage(video,sx,sy,ow,oh,0,0,ow,oh);
function startRecording(){
  if(!currentStream)return;
  recordedChunks=[];
  var mime=getBestMime();
  try{
    mediaRecorder=new MediaRecorder(currentStream,mime?{mimeType:mime,videoBitsPerSecond:12000000}:{videoBitsPerSecond:12000000});
  }catch(e){
    try{mediaRecorder=new MediaRecorder(currentStream)}catch(e2){alert('Recording not supported');return}
  }
  mediaRecorder.ondataavailable=function(e){if(e.data&&e.data.size>0)recordedChunks.push(e.data)};
  mediaRecorder.onstop=function(){
    if(!recordedChunks.length){alert('No data recorded');return}
    var mimeFinal=mediaRecorder.mimeType||'video/mp4';
    var blob=new Blob(recordedChunks,{type:mimeFinal});
    recordedChunks=[];
    if(modalBlobUrl)URL.revokeObjectURL(modalBlobUrl);
    modalBlob=blob;modalBlobUrl=URL.createObjectURL(blob);
    modalType='video';
    modalVideo.src=modalBlobUrl;modalVideo.style.display='block';
    modalImage.style.display='none';
    modalHint.textContent='tap \u2193 save to download';
    icAI.style.display='none';icPresets.style.display='none';
    modalOverlay.classList.add('open');
    closeSheet();
  };
  mediaRecorder.start(1000);
  isRecording=true;
  captureBtn.classList.add('recording');captureBtn.textContent='\u25a0 stop';
  recStartTime=Date.now();recTimer.style.display='block';
  recTimerInt=setInterval(function(){
    var s=Math.floor((Date.now()-recStartTime)/1000);
    recTimer.textContent=('0'+Math.floor(s/60)).slice(-2)+':'+('0'+(s%60)).slice(-2);
  },250);
}

icSave.addEventListener('click',async function(){

  }else{
    // download video file
    var ext=(modalBlob.type.indexOf('mp4')>=0)?'mp4':'webm';

    if(navigator.share&&navigator.canShare){
      try{

        if(canShare){await navigator.share({files:[file],title:fname});await dbAdd({type:'video',blob:modalBlob,ts:Date.now()});renderGallery();return}
      }catch(e){}
    }
    // fallback: direct download
    var a=document.createElement('a');
    a.href=modalBlobUrl;a.download=fname;
    document.body.appendChild(a);a.click();document.body.removeChild(a);
    await dbAdd({type:'video',blob:modalBlob,ts:Date.now()});

  }
});

/* ===== PRESETS ===== */
var PRESET_DEFS=[
  {key:'intensity',label:'Intensity',min:0,max:100,step:0.5,def:100},
  {key:'exposure',label:'Exposure',min:-100,max:100,step:0.5,def:0},
  {key:'contrast',label:'Contrast',min:-100,max:100,step:0.5,def:0},
  {key:'saturation',label:'Saturation',min:-100,max:100,step:0.5,def:0},
  {key:'warmth',label:'Warmth',min:-100,max:100,step:0.5,def:0},
  {key:'gamma',label:'Gamma',min:-100,max:100,step:0.5,def:0},
  {key:'wbGreenRed',label:'WB Grn↔Red',min:-100,max:100,step:0.5,def:0},
  {key:'wbBlueYellow',label:'WB Blu↔Yel',min:-100,max:100,step:0.5,def:0},
  {key:'highlightTone',label:'Highlights',min:-100,max:100,step:0.5,def:0},
  {key:'shadowTone',label:'Shadows',min:-100,max:100,step:0.5,def:0},
  {key:'sharpness',label:'Sharpness',min:0,max:100,step:0.5,def:0},
  {key:'clarity',label:'Clarity',min:0,max:100,step:0.5,def:0},
  {key:'halation',label:'Halation',min:0,max:100,step:0.5,def:0},
  {key:'grain',label:'Grain',min:0,max:100,step:0.5,def:0}
];
var BUILTIN_PRESETS=[
  {name:'Original',builtin:true,values:{intensity:100,exposure:0,contrast:0,saturation:0,warmth:0,gamma:0,wbGreenRed:0,wbBlueYellow:0,highlightTone:0,shadowTone:0,sharpness:0,clarity:0,halation:0,grain:0}},
  {name:'Natural',builtin:true,values:{intensity:100,exposure:4.0,contrast:-4.0,saturation:-3.0,warmth:-6.5,gamma:0.5,wbGreenRed:-1.5,wbBlueYellow:4.5,highlightTone:-2.0,shadowTone:-0.5,sharpness:4.0,clarity:4.0,halation:0.0,grain:0}}
];
function customPresets(){try{return JSON.parse(localStorage.getItem('custom_presets')||'[]')}catch(e){return[]}}
function saveCustomPresets(p){localStorage.setItem('custom_presets',JSON.stringify(p))}
var presetSliders={};
function buildPresetRows(){
  presetRows.innerHTML='';
  var posted=false;
  for(var i=0;i<PRESET_DEFS.length;i++){
    var def=PRESET_DEFS[i];
    if(def.key==='sharpness'&&!posted){
      var t=document.createElement('div');t.className='sec-title';t.textContent='post processing';presetRows.appendChild(t);posted=true;
    }
    var row=document.createElement('div');row.className='preset-row';
    var lbl=document.createElement('label');lbl.textContent=def.label;
    var sl=document.createElement('input');sl.type='range';sl.min=def.min;sl.max=def.max;sl.step=def.step;sl.value=def.def;
    var val=document.createElement('span');val.textContent=fmtVal(def.def);
    sl.addEventListener('input',function(v){return function(){v.textContent=fmtVal(this.value)}}(val));
    row.appendChild(lbl);row.appendChild(sl);row.appendChild(val);
    presetRows.appendChild(row);
    presetSliders[def.key]=sl;
  }
}
function fmtVal(v){v=parseFloat(v);return v%1===0?String(v):v.toFixed(1)}
function refreshPresetSelect(){
  presetSelect.innerHTML='';
  var all=BUILTIN_PRESETS.concat(customPresets());
  for(var i=0;i<all.length;i++){
    var o=document.createElement('option');o.value=all[i].name;
    o.textContent=all[i].builtin?all[i].name:all[i].name+' ✎';
    presetSelect.appendChild(o);
  }
  presetDelBtn.disabled=true;
}
function applyPresetValues(vals){
  for(var i=0;i<PRESET_DEFS.length;i++){
    var def=PRESET_DEFS[i];
    var v=(vals&&vals[def.key]!=null)?vals[def.key]:def.def;
    presetSliders[def.key].value=v;
    presetSliders[def.key].parentElement.querySelector('span').textContent=fmtVal(v);
  }
}
function getPresetValues(){var v={};for(var k in presetSliders)v[k]=parseFloat(presetSliders[k].value);return v}
function resetPresetsUI(){applyPresetValues(BUILTIN_PRESETS[0].values);presetSelect.value='Original'}
presetSelect.addEventListener('change',function(){
  var all=BUILTIN_PRESETS.concat(customPresets());
  var p=null;
  for(var i=0;i<all.length;i++){if(all[i].name===presetSelect.value){p=all[i];break}}
  if(p)applyPresetValues(p.values);
  presetDelBtn.disabled=!!(p&&p.builtin);
});
presetSaveBtn.addEventListener('click',function(){
  var name=prompt('preset name?');
  if(!name||!name.trim())return;
  var customs=customPresets();
  var vals=getPresetValues();
  var found=false;
  for(var i=0;i<customs.length;i++){
    if(customs[i].name===name.trim()){customs[i].values=vals;found=true;break}
  }
  if(!found)customs.push({name:name.trim(),values:vals});
  saveCustomPresets(customs);refreshPresetSelect();presetSelect.value=name.trim();presetDelBtn.disabled=false;
});
presetDelBtn.addEventListener('click',function(){
  var name=presetSelect.value;
  var customs=customPresets().filter(function(p){return p.name!==name});
  saveCustomPresets(customs);refreshPresetSelect();resetPresetsUI();
});

/* ===== IMAGE PROCESSING ===== */
function applyPresets(){
  if(!baseImageData)return;
  var src=baseImageData;
  var out=new ImageData(new Uint8ClampedArray(src.data),src.width,src.height);
  var v=getPresetValues();
  var t=v.intensity/100;
  var d=out.data;
  var expMul=Math.pow(2,(v.exposure/100)*t);
  var conF=(v.contrast/100)*t+1;
  var satF=(v.saturation/100)*t+1;
  var wShift=(v.warmth/100)*40*t;
  var gr=(v.wbGreenRed/100)*30*t;
  var by=(v.wbBlueYellow/100)*30*t;
  var gammaExp=(v.gamma===0)?1:Math.pow(2,-(v.gamma/100)*t);
  var hiF=(v.highlightTone/100)*t;
  var shF=(v.shadowTone/100)*t;
  for(var i=0;i<d.length;i+=4){
    var r=d[i],g=d[i+1],b=d[i+2];
    r*=expMul;g*=expMul;b*=expMul;
    r=(r-128)*conF+128;g=(g-128)*conF+128;b=(b-128)*conF+128;
    r+=wShift;b-=wShift;
    g+=gr;r-=gr;
    b+=by;r-=by*0.5;g-=by*0.5;
    if(gammaExp!==1){
      r=Math.pow(Math.max(0,r)/255,gammaExp)*255;
      g=Math.pow(Math.max(0,g)/255,gammaExp)*255;
      b=Math.pow(Math.max(0,b)/255,gammaExp)*255;
    }
    var lum=0.299*r+0.587*g+0.114*b;
    r=lum+(r-lum)*satF;g=lum+(g-lum)*satF;b=lum+(b-lum)*satF;
    var lum2=0.299*r+0.587*g+0.114*b;
    if(lum2>180){var k=1+hiF*((lum2-180)/75);r=(r-180)*k+180;g=(g-180)*k+180;b=(b-180)*k+180}
    else if(lum2<70){var k2=1+shF*((70-lum2)/70);r*=k2;g*=k2;b*=k2}
    d[i]=Math.max(0,Math.min(255,r));d[i+1]=Math.max(0,Math.min(255,g));d[i+2]=Math.max(0,Math.min(255,b));
  }
  if(v.sharpness>0)unsharp(out,1,(v.sharpness/100)*t*1.5,false);
  if(v.clarity>0)unsharp(out,5,(v.clarity/100)*t*1.2,true);
  if(v.halation>0)halation(out,(v.halation/100)*t);
  if(v.grain>0)grain(out,(v.grain/100)*t);
  canvas.width=out.width;canvas.height=out.height;
  canvas.getContext('2d').putImageData(out,0,0);
  canvas.toBlob(function(blob){
    if(modalBlobUrl)URL.revokeObjectURL(modalBlobUrl);
    modalBlob=blob;modalBlobUrl=URL.createObjectURL(blob);
    modalImage.src=modalBlobUrl;
  },'image/png');
}
function boxBlur(src,w,h,r){
  var tmp=new Uint8ClampedArray(src.length),out=new Uint8ClampedArray(src.length);
  var x,y,k;
  for(y=0;y<h;y++)for(x=0;x<w;x++){
    var rr=0,gg=0,bb=0,c=0;
    for(k=-r;k<=r;k++){var nx=x+k;if(nx<0||nx>=w)continue;var i=(y*w+nx)*4;rr+=src[i];gg+=src[i+1];bb+=src[i+2];c++}
    var j=(y*w+x)*4;tmp[j]=rr/c;tmp[j+1]=gg/c;tmp[j+2]=bb/c;tmp[j+3]=src[j+3];
  }
  for(y=0;y<h;y++)for(x=0;x<w;x++){
    var rr2=0,gg2=0,bb2=0,c2=0;
    for(k=-r;k<=r;k++){var ny=y+k;if(ny<0||ny>=h)continue;var i2=(ny*w+x)*4;rr2+=tmp[i2];gg2+=tmp[i2+1];bb2+=tmp[i2+2];c2++}
    var j2=(y*w+x)*4;out[j2]=rr2/c2;out[j2+1]=gg2/c2;out[j2+2]=bb2/c2;out[j2+3]=tmp[j2+3];
  }
  return out;
}
function unsharp(img,r,amount,midOnly){
  var w=img.width,h=img.height,src=new Uint8ClampedArray(img.data),d=img.data;
  var blur=boxBlur(src,w,h,r);
  for(var i=0;i<d.length;i+=4){
    var lum=(src[i]+src[i+1]+src[i+2])/3;
    var mask=1;
    if(midOnly)mask=1-Math.abs(lum-128)/128;
    for(var c=0;c<3;c++){
      var detail=src[i+c]-blur[i+c];
      d[i+c]=Math.max(0,Math.min(255,src[i+c]+detail*amount*mask));
    }
  }
}
function halation(img,amount){
  var w=img.width,h=img.height,src=new Uint8ClampedArray(img.data);
  var hi=new Uint8ClampedArray(src.length);
  for(var i=0;i<src.length;i+=4){
    var lum=(src[i]+src[i+1]+src[i+2])/3;
    if(lum>200){var k=(lum-200)/55;hi[i]=src[i]*k;hi[i+1]=src[i+1]*k;hi[i+2]=src[i+2]*k;hi[i+3]=255}
  }
  var blur=boxBlur(hi,w,h,6),d=img.data;
  for(var i2=0;i2<d.length;i2+=4)for(var c=0;c<3;c++)d[i2+c]=Math.max(0,Math.min(255,d[i2+c]+blur[i2+c]*amount*0.8));
}
function grain(img,amount){
  var d=img.data,inten=amount*50;
  for(var i=0;i<d.length;i+=4){
    var n=(Math.random()-0.5)*inten;
    d[i]=Math.max(0,Math.min(255,d[i]+n));
    d[i+1]=Math.max(0,Math.min(255,d[i+1]+n));
    d[i+2]=Math.max(0,Math.min(255,d[i+2]+n));
  }
}

/* ===== AI ===== */
aiSubmitBtn.addEventListener('click',async function(){
  var apiKey=localStorage.getItem('openai_key');
  if(!apiKey){aiStatus.textContent='paste your key in ⚙ first.';return}
  var prompt=aiPrompt.value.trim();
  if(!prompt){aiStatus.textContent='tell it what to change.';return}
  if(!modalBlob||modalType!=='photo'){aiStatus.textContent='photos only.';return}
  aiSubmitBtn.disabled=true;aiStatus.textContent='thinking… (5–20s)';
  try{
    var form=new FormData();
    form.append('image',modalBlob,'photo.png');
    form.append('prompt',prompt);
    form.append('model',aiModelSelect.value||'gpt-image-1');
    form.append('size','auto');
    var resp=await fetch('https://api.openai.com/v1/images/edits',{method:'POST',headers:{'Authorization':'Bearer '+apiKey},body:form});
    var data=await resp.json();
    if(!resp.ok)throw new Error((data.error&&data.error.message)||('HTTP '+resp.status));
    var b64=data.data&&data.data[0]&&data.data[0].b64_json;
    if(!b64)throw new Error('empty response');
    var bin=atob(b64);var arr=new Uint8Array(bin.length);
    for(var i=0;i<bin.length;i++)arr[i]=bin.charCodeAt(i);
    var blob=new Blob([arr],{type:'image/png'});
    if(modalBlobUrl)URL.revokeObjectURL(modalBlobUrl);
    modalBlob=blob;modalBlobUrl=URL.createObjectURL(blob);
    modalImage.src=modalBlobUrl;
    var img=new Image();
    img.onload=function(){canvas.width=img.naturalWidth;canvas.height=img.naturalHeight;var c2=canvas.getContext('2d');c2.drawImage(img,0,0);baseImageData=c2.getImageData(0,0,canvas.width,canvas.height)};
    img.src=modalBlobUrl;
    aiStatus.textContent='done. hold to save or keep editing.';
  }catch(err){
    console.error(err);aiStatus.textContent='error: '+err.message;
  }finally{aiSubmitBtn.disabled=false}
});
