<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Camera</title>
<style>
  body {
    font-family: 'Georgia', Serif, sans-serif;
    display: flex; flex-direction: column; align-items: center;
    min-height: 100vh; margin: 0; padding: 10px;
    background: #000; color: #fff;
  }
  #video { width: 100%; max-height: 55vh; background: #000; object-fit: contain; }
  .controls, .post-controls {
    margin-top: 15px; display: flex; flex-wrap: wrap;
    justify-content: center; gap: 10px;
  }
  .advanced-controls {
    margin-top: 15px;
    display: grid; grid-template-columns: 80px 100px 150px;
    gap: 12px; align-items: center;
    background: #000; padding: 15px; border-radius: 20px;
    border: 1px solid #fff; max-width: 90vw;
  }
  .advanced-controls label { font-size: 20px; font-weight: bold; }
  button, select, input[type="text"], textarea {
    padding: 10px 18px; font-size: 18px; font-family: inherit;
    background: #000; color: #fff; border: 1px solid #fff;
    border-radius: 20px; cursor: pointer; transition: all .2s;
  }
  button:hover:not(:disabled), select:hover:not(:disabled) { background: #111; }
  button:disabled, select:disabled, input[type="range"]:disabled { opacity: .3; cursor: not-allowed; }
  button.active { background: #fff; color: #000; font-weight: bold; }
  #camera-select { display: none; }
  #canvas { display: none; }
  input[type="range"] { width: 100%; cursor: pointer; accent-color: #fff; }

  /* Preview */
  #preview-section { width: 100%; max-width: 90vw; margin-top: 20px; display: none; }
  #preview-image {
    width: 70vw; max-width: 70vw; height: auto;
    border: 1px solid #fff; border-radius: 10px;
    display: block; margin: 0 auto;
    touch-action: manipulation;
  }
  .preview-hint {
    text-align: center; font-size: 14px; opacity: .6;
    margin-top: 6px; font-style: italic;
  }

  /* Presets panel */
  #presets-panel {
    margin-top: 15px; padding: 15px;
    background: #000; border: 1px solid #fff;
    border-radius: 20px; width: 100%; max-width: 90vw;
    display: none;
  }
  #presets-panel h3 { margin: 0 0 12px 0; font-size: 18px; }
  .preset-row {
    display: grid; grid-template-columns: 130px 1fr 50px;
    align-items: center; gap: 10px; margin-bottom: 8px;
  }
  .preset-row label { font-size: 14px; }
  .preset-row span { font-size: 13px; opacity: .7; text-align: right; }
  .preset-section-title {
    font-size: 13px; opacity: .6; margin: 14px 0 4px 0;
    border-top: 1px solid #333; padding-top: 10px;
  }

  /* AI panel */
  #ai-panel {
    margin-top: 15px; padding: 15px;
    background: #000; border: 1px solid #fff;
    border-radius: 20px; width: 100%; max-width: 90vw;
    display: none;
  }
  #ai-prompt {
    width: 100%; min-height: 60px; resize: vertical;
    font-family: inherit; font-size: 16px;
  }
  #ai-status { font-size: 14px; opacity: .7; margin-top: 8px; font-style: italic; }

  /* Gallery */
  #gallery-section { width: 100%; max-width: 90vw; margin-top: 30px; }
  #gallery-section h3 { margin: 0 0 10px 0; display: flex; justify-content: space-between; align-items: center; }
  #gallery-grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(90px, 1fr));
    gap: 8px;
  }
  .gallery-thumb {
    width: 100%; aspect-ratio: 1; object-fit: cover;
    border: 1px solid #fff; border-radius: 8px; cursor: pointer;
  }
  .gallery-empty { opacity: .5; font-style: italic; font-size: 14px; }

  /* Settings */
  #settings-btn { position: fixed; top: 10px; right: 10px; padding: 6px 12px; font-size: 14px; z-index: 10; }
  #settings-panel {
    position: fixed; top: 50px; right: 10px;
    background: #000; border: 1px solid #fff; border-radius: 15px;
    padding: 15px; width: 280px; display: none; z-index: 10;
  }
  #settings-panel label { display: block; font-size: 13px; margin-bottom: 4px; opacity: .8; }
  #settings-panel input { width: 100%; margin-bottom: 10px; }

  .hidden { display: none !important; }
</style>
</head>
<body>

<button id="settings-btn">⚙</button>
<div id="settings-panel">
  <label>OpenAI API key (for AI modify)</label>
  <input type="password" id="api-key-input" placeholder="sk-...">
  <label>AI model</label>
  <select id="ai-model-select">
    <option value="gpt-image-1">gpt-image-1</option>
  </select>
  <button id="save-settings-btn" style="margin-top:10px; width:100%;">save</button>
  <button id="clear-gallery-btn" style="margin-top:8px; width:100%;">clear gallery</button>
</div>

<video id="video" autoplay playsinline></video>

<div class="controls">
  <button id="list-cameras-btn">switch modes</button>
  <select id="camera-select"></select>
  <button id="torch-btn" disabled>torch is OFF</button>
  <button id="capture-btn">capture</button>
</div>

<div class="advanced-controls" id="advanced-panel">
  <label>focus</label>
  <select id="focus-mode" disabled>
    <option value="continuous">auto</option>
    <option value="manual">manual</option>
  </select>
  <input type="range" id="focus-slider" disabled>

  <label>exposure</label>
  <select id="exposure-mode" disabled>
    <option value="continuous">auto</option>
    <option value="manual">manual</option>
  </select>
  <input type="range" id="exposure-slider" disabled>

  <label>ISO</label>
  <select id="iso-mode" disabled>
    <option value="auto">auto</option>
    <option value="manual">manual</option>
  </select>
  <input type="range" id="iso-slider" disabled>
</div>

<canvas id="canvas"></canvas>

<!-- PREVIEW -->
<section id="preview-section">
  <img id="preview-image" alt="preview">
  <div class="preview-hint">hold to save • pinch to zoom</div>

  <div class="post-controls">
    <button id="ai-toggle-btn">modify with AI</button>
    <button id="presets-toggle-btn">presets</button>
    <button id="save-gallery-btn">save to gallery</button>
    <button id="retake-btn">retake</button>
  </div>

  <div id="ai-panel">
    <textarea id="ai-prompt" placeholder="what do we change? e.g. 'remove people', 'give me better lighting', 'make it cinematic'"></textarea>
    <div class="post-controls" style="margin-top:10px;">
      <button id="ai-submit-btn">send to AI</button>
    </div>
    <div id="ai-status"></div>
  </div>

  <div id="presets-panel">
    <h3>photographic presets</h3>
    <div class="preset-section-title">tone & color</div>
    <!-- rows injected by JS for live value readout -->
    <div id="preset-rows"></div>
    <div class="post-controls" style="margin-top:12px;">
      <button id="apply-presets-btn">apply to preview</button>
      <button id="reset-presets-btn">reset</button>
    </div>
  </div>
</section>

<!-- GALLERY -->
<section id="gallery-section">
  <h3>gallery <span id="gallery-count" class="gallery-empty"></span></h3>
  <div id="gallery-grid"></div>
</section>

<script>
/* ---------- ELEMENTS ---------- */
const video = document.getElementById('video');
const canvas = document.getElementById('canvas');
const captureBtn = document.getElementById('capture-btn');
const listCamerasBtn = document.getElementById('list-cameras-btn');
const cameraSelect = document.getElementById('camera-select');
const torchBtn = document.getElementById('torch-btn');

const focusMode = document.getElementById('focus-mode');
const focusSlider = document.getElementById('focus-slider');
const exposureMode = document.getElementById('exposure-mode');
const exposureSlider = document.getElementById('exposure-slider');
const isoMode = document.getElementById('iso-mode');
const isoSlider = document.getElementById('iso-slider');

const previewSection = document.getElementById('preview-section');
const previewImage = document.getElementById('preview-image');
const aiToggleBtn = document.getElementById('ai-toggle-btn');
const presetsToggleBtn = document.getElementById('presets-toggle-btn');
const saveGalleryBtn = document.getElementById('save-gallery-btn');
const retakeBtn = document.getElementById('retake-btn');
const aiPanel = document.getElementById('ai-panel');
const presetsPanel = document.getElementById('presets-panel');
const aiPrompt = document.getElementById('ai-prompt');
const aiSubmitBtn = document.getElementById('ai-submit-btn');
const aiStatus = document.getElementById('ai-status');
const applyPresetsBtn = document.getElementById('apply-presets-btn');
const resetPresetsBtn = document.getElementById('reset-presets-btn');
const presetRows = document.getElementById('preset-rows');

const settingsBtn = document.getElementById('settings-btn');
const settingsPanel = document.getElementById('settings-panel');
const apiKeyInput = document.getElementById('api-key-input');
const aiModelSelect = document.getElementById('ai-model-select');
const saveSettingsBtn = document.getElementById('save-settings-btn');
const clearGalleryBtn = document.getElementById('clear-gallery-btn');
const galleryGrid = document.getElementById('gallery-grid');
const galleryCount = document.getElementById('gallery-count');

let currentStream = null;
let videoTrack = null;
let isTorchOn = false;
let currentPreviewDataUrl = null;   // base64 png currently in preview
let originalPreviewDataUrl = null; // snapshot before presets so we can reset
let baseImageData = null;          // ImageData from the captured frame (for presets)

/* ---------- INDEXEDDB GALLERY ---------- */
const DB_NAME = 'camera_gallery';
const STORE = 'photos';
let db = null;

function openDB() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, 1);
    req.onupgradeneeded = e => {
      const d = e.target.result;
      if (!d.objectStoreNames.contains(STORE)) {
        d.createObjectStore(STORE, { keyPath: 'id', autoIncrement: true });
      }
    };
    req.onsuccess = e => { db = e.target.result; resolve(db); };
    req.onerror = e => reject(e.target.error);
  });
}
function addPhoto(dataUrl) {
  return new Promise((res, rej) => {
    const tx = db.transaction(STORE, 'readwrite');
    tx.objectStore(STORE).add({ dataUrl, ts: Date.now() });
    tx.oncomplete = () => res();
    tx.onerror = e => rej(e.target.error);
  });
}
function getAllPhotos() {
  return new Promise((res, rej) => {
    const tx = db.transaction(STORE, 'readonly');
    const req = tx.objectStore(STORE).getAll();
    req.onsuccess = () => res(req.result);
    req.onerror = e => rej(e.target.error);
  });
}
function clearAllPhotos() {
  return new Promise((res, rej) => {
    const tx = db.transaction(STORE, 'readwrite');
    tx.objectStore(STORE).clear();
    tx.oncomplete = () => res();
    tx.onerror = e => rej(e.target.error);
  });
}
async function renderGallery() {
  const photos = (await getAllPhotos()).sort((a,b) => b.ts - a.ts);
  galleryCount.textContent = photos.length ? `(${photos.length})` : '';
  galleryGrid.innerHTML = '';
  if (!photos.length) {
    galleryGrid.innerHTML = '<div class="gallery-empty">no photos yet</div>';
    return;
  }
  for (const p of photos) {
    const img = document.createElement('img');
    img.src = p.dataUrl;
    img.className = 'gallery-thumb';
    img.addEventListener('click', () => {
      // open in preview for long-press save
      currentPreviewDataUrl = p.dataUrl;
      originalPreviewDataUrl = p.dataUrl;
      previewImage.src = p.dataUrl;
      previewSection.style.display = 'block';
      window.scrollTo({ top: 0, behavior: 'smooth' });
    });
    galleryGrid.appendChild(img);
  }
}

/* ---------- PRESETS PIPELINE ---------- */
const PRESET_DEFS = [
  { key:'intensity',      label:'Intensity',      min:0,   max:100, step:1,    def:100 },
  { key:'exposure',       label:'Exposure',       min:-100,max:100, step:1,    def:0   },
  { key:'contrast',       label:'Contrast',       min:-100,max:100, step:1,    def:0   },
  { key:'saturation',     label:'Saturation',     min:-100,max:100, step:1,    def:0   },
  { key:'warmth',         label:'Warmth',         min:-100,max:100, step:1,    def:0   },
  { key:'gamma',          label:'Gamma',          min:-100,max:100, step:1,    def:0   },
  { key:'wbGreenRed',     label:'WB Green↔Red',   min:-100,max:100, step:1,    def:0   },
  { key:'wbBlueYellow',   label:'WB Blue↔Yellow', min:-100,max:100, step:1,    def:0   },
  { key:'highlightTone',  label:'Highlight Tone', min:-100,max:100, step:1,    def:0   },
  { key:'shadowTone',     label:'Shadow Tone',    min:-100,max:100, step:1,    def:0   },
  { key:'sharpness',      label:'Sharpness',      min:0,   max:100, step:1,    def:0   },
  { key:'clarity',        label:'Clarity',        min:0,   max:100, step:1,    def:0   },
  { key:'halation',       label:'Halation',       min:0,   max:100, step:1,    def:0   },
  { key:'grain',          label:'Grain',          min:0,   max:100, step:1,    def:0   },
];
const presetSliders = {};

function buildPresetRows() {
  presetRows.innerHTML = '';
  let currentTitle = null;
  const postKeys = new Set(['sharpness','clarity','halation','grain']);
  for (const def of PRESET_DEFS) {
    if (def.key === 'sharpness' && currentTitle !== 'post') {
      const t = document.createElement('div');
      t.className = 'preset-section-title';
      t.textContent = 'post processing';
      presetRows.appendChild(t);
      currentTitle = 'post';
    }
    const row = document.createElement('div');
    row.className = 'preset-row';
    const lbl = document.createElement('label');
    lbl.textContent = def.label;
    const slider = document.createElement('input');
    slider.type = 'range';
    slider.min = def.min; slider.max = def.max;
    slider.step = def.step; slider.value = def.def;
    const val = document.createElement('span');
    val.textContent = def.def;
    slider.addEventListener('input', () => { val.textContent = slider.value; });
    row.appendChild(lbl); row.appendChild(slider); row.appendChild(val);
    presetRows.appendChild(row);
    presetSliders[def.key] = slider;
  }
}
function getPresetValues() {
  const v = {};
  for (const k in presetSliders) v[k] = parseFloat(presetSliders[k].value);
  return v;
}
function resetPresetsUI() {
  for (const def of PRESET_DEFS) {
    presetSliders[def.key].value = def.def;
    presetSliders[def.key].nextElementSibling && (presetSliders[def.key].parentElement.querySelector('span').textContent = def.def);
  }
  // fix the span text properly
  for (const def of PRESET_DEFS) {
    const sl = presetSliders[def.key];
    sl.parentElement.querySelector('span').textContent = def.def;
  }
}

function applyPresets() {
  if (!baseImageData) return;
  const src = baseImageData;
  const out = new ImageData(
    new Uint8ClampedArray(src.data),
    src.width, src.height
  );
  const v = getPresetValues();
  const t = v.intensity / 100;
  const d = out.data;

  // Exposure multiplier
  const expMul = Math.pow(2, (v.exposure / 100) * t);
  // Contrast factor
  const conF = (v.contrast / 100) * t + 1;
  // Saturation factor
  const satF = (v.saturation / 100) * t + 1;
  // Warmth shift
  const wShift = (v.warmth / 100) * 40 * t;
  // WB shifts
  const gr = (v.wbGreenRed / 100) * 30 * t;
  const by = (v.wbBlueYellow / 100) * 30 * t;
  // Gamma
  const gamma = v.gamma === 0 ? 1 : Math.pow(2, -(v.gamma / 100) * t);
  // Highlight / Shadow
  const hiF = (v.highlightTone / 100) * t;
  const shF = (v.shadowTone / 100) * t;

  for (let i = 0; i < d.length; i += 4) {
    let r = d[i], g = d[i+1], b = d[i+2];

    // Exposure
    r *= expMul; g *= expMul; b *= expMul;

    // Contrast around 128
    r = (r - 128) * conF + 128;
    g = (g - 128) * conF + 128;
    b = (b - 128) * conF + 128;

    // Warmth
    r += wShift;
    b -= wShift;

    // WB green-red
    g += gr;
    r -= gr;

    // WB blue-yellow
    b += by;
    r -= by * 0.5;
    g -= by * 0.5;

    // Gamma
    if (gamma !== 1) {
      r = Math.pow(Math.max(0, r) / 255, gamma) * 255;
      g = Math.pow(Math.max(0, g) / 255, gamma) * 255;
      b = Math.pow(Math.max(0, b) / 255, gamma) * 255;
    }

    // Saturation
    const lum = 0.299*r + 0.587*g + 0.114*b;
    r = lum + (r - lum) * satF;
    g = lum + (g - lum) * satF;
    b = lum + (b - lum) * satF;

    // Highlight / Shadow
    const lum2 = 0.299*r + 0.587*g + 0.114*b;
    if (lum2 > 180) {
      const k = 1 + hiF * ((lum2 - 180) / 75);
      r = (r - 180) * k + 180;
      g = (g - 180) * k + 180;
      b = (b - 180) * k + 180;
    } else if (lum2 < 70) {
      const k = 1 + shF * ((70 - lum2) / 70);
      r *= k; g *= k; b *= k;
    }

    d[i]   = Math.max(0, Math.min(255, r));
    d[i+1] = Math.max(0, Math.min(255, g));
    d[i+2] = Math.max(0, Math.min(255, b));
  }

  // Post-processing passes on out
  if (v.sharpness > 0) unsharpMask(out, 1, (v.sharpness/100) * t * 1.5);
  if (v.clarity > 0)   unsharpMask(out, 5, (v.clarity/100) * t * 1.2, true);
  if (v.halation > 0)  applyHalation(out, (v.halation/100) * t);
  if (v.grain > 0)     applyGrain(out, (v.grain/100) * t);

  // Put to canvas, export
  canvas.width = out.width;
  canvas.height = out.height;
  canvas.getContext('2d').putImageData(out, 0, 0);
  const dataUrl = canvas.toDataURL('image/png');
  previewImage.src = dataUrl;
  currentPreviewDataUrl = dataUrl;
}

function unsharpMask(imgData, radius, amount, midtoneOnly=false) {
  // radius in pixels (1 or 5), amount 0..1.5
  const w = imgData.width, h = imgData.height;
  const src = new Uint8ClampedArray(imgData.data);
  const dst = imgData.data;
  // simple box blur approximation
  const blur = boxBlur(src, w, h, radius);
  for (let i = 0; i < dst.length; i += 4) {
    const lum = (src[i] + src[i+1] + src[i+2]) / 3;
    let mask = 1;
    if (midtoneOnly) {
      // reduce effect in shadows and highlights
      const distFromMid = Math.abs(lum - 128) / 128;
      mask = 1 - distFromMid;
    }
    for (let c = 0; c < 3; c++) {
      const detail = src[i+c] - blur[i+c];
      let v = src[i+c] + detail * amount * mask;
      dst[i+c] = Math.max(0, Math.min(255, v));
    }
  }
}
function boxBlur(src, w, h, r) {
  const out = new Uint8ClampedArray(src.length);
  const tmp = new Uint8ClampedArray(src.length);
  // horizontal
  for (let y = 0; y < h; y++) {
    for (let x = 0; x < w; x++) {
      let rr=0,gg=0,bb=0,cnt=0;
      for (let k = -r; k <= r; k++) {
        const nx = x + k;
        if (nx < 0 || nx >= w) continue;
        const idx = (y*w + nx) * 4;
        rr += src[idx]; gg += src[idx+1]; bb += src[idx+2]; cnt++;
      }
      const idx = (y*w + x) * 4;
      tmp[idx] = rr/cnt; tmp[idx+1] = gg/cnt; tmp[idx+2] = bb/cnt; tmp[idx+3] = src[idx+3];
    }
  }
  // vertical
  for (let y = 0; y < h; y++) {
    for (let x = 0; x < w; x++) {
      let rr=0,gg=0,bb=0,cnt=0;
      for (let k = -r; k <= r; k++) {
        const ny = y + k;
        if (ny < 0 || ny >= h) continue;
        const idx = (ny*w + x) * 4;
        rr += tmp[idx]; gg += tmp[idx+1]; bb += tmp[idx+2]; cnt++;
      }
      const idx = (y*w + x) * 4;
      out[idx] = rr/cnt; out[idx+1] = gg/cnt; out[idx+2] = bb/cnt; out[idx+3] = tmp[idx+3];
    }
  }
  return out;
}
function applyHalation(imgData, amount) {
  // glow around bright pixels: blur highlights and add back
  const w = imgData.width, h = imgData.height;
  const src = new Uint8ClampedArray(imgData.data);
  // isolate highlights
  const hi = new Uint8ClampedArray(src.length);
  for (let i = 0; i < src.length; i += 4) {
    const lum = (src[i] + src[i+1] + src[i+2]) / 3;
    if (lum > 200) {
      const k = (lum - 200) / 55;
      hi[i] = src[i]*k; hi[i+1] = src[i+1]*k; hi[i+2] = src[i+2]*k; hi[i+3] = 255;
    }
  }
  const blur = boxBlur(hi, w, h, 6);
  const d = imgData.data;
  for (let i = 0; i < d.length; i += 4) {
    for (let c = 0; c < 3; c++) {
      d[i+c] = Math.max(0, Math.min(255, d[i+c] + blur[i+c] * amount * 0.8));
    }
  }
}
function applyGrain(imgData, amount) {
  const d = imgData.data;
  const intensity = amount * 50;
  for (let i = 0; i < d.length; i += 4) {
    const n = (Math.random() - 0.5) * intensity;
    d[i]   = Math.max(0, Math.min(255, d[i]   + n));
    d[i+1] = Math.max(0, Math.min(255, d[i+1] + n));
    d[i+2] = Math.max(0, Math.min(255, d[i+2] + n));
  }
}

/* ---------- AI MODIFY ---------- */
async function modifyWithAI() {
  const apiKey = localStorage.getItem('openai_key');
  if (!apiKey) {
    aiStatus.textContent = 'paste your OpenAI API key in ⚙ settings first.';
    return;
  }
  const prompt = aiPrompt.value.trim();
  if (!prompt) {
    aiStatus.textContent = 'tell it what to do.';
    return;
  }
  if (!currentPreviewDataUrl) {
    aiStatus.textContent = 'no image to modify.';
    return;
  }
  aiSubmitBtn.disabled = true;
  aiStatus.textContent = 'thinking... (can take 5-15s)';
  try {
    const blob = await (await fetch(currentPreviewDataUrl)).blob();
    const form = new FormData();
    form.append('image', blob, 'photo.png');
    form.append('prompt', prompt);
    form.append('model', aiModelSelect.value || 'gpt-image-1');
    form.append('size', 'auto');
    form.append('response_format', 'b64_json');

    const resp = await fetch('https://api.openai.com/v1/images/edits', {
      method: 'POST',
      headers: { 'Authorization': `Bearer ${apiKey}` },
      body: form
    });
    const data = await resp.json();
    if (!resp.ok) throw new Error(data.error?.message || 'API error');
    const b64 = data.data?.[0]?.b64_json;
    if (!b64) throw new Error('no image in response');
    const newDataUrl = 'data:image/png;base64,' + b64;
    previewImage.src = newDataUrl;
    currentPreviewDataUrl = newDataUrl;
    aiStatus.textContent = 'done. hold image to save.';
  } catch (err) {
    console.error(err);
    aiStatus.textContent = 'error: ' + err.message;
  } finally {
    aiSubmitBtn.disabled = false;
  }
}

/* ---------- CAMERA CORE (unchanged) ---------- */
function stopMediaTracks(stream) {
  if (stream) stream.getTracks().forEach(t => t.stop());
}
function startCamera(deviceId = null) {
  stopMediaTracks(currentStream);
  const constraints = {
    audio: false,
    video: {
      width: { ideal: 9999999 }, height: { ideal: 9999999 },
      ...(deviceId ? { deviceId: { exact: deviceId } } : { facingMode: 'environment' })
    }
  };
  navigator.mediaDevices.getUserMedia(constraints)
    .then(stream => {
      currentStream = stream;
      video.srcObject = stream;
      videoTrack = stream.getVideoTracks()[0];
      setTimeout(() => setupAdvancedControls(videoTrack), 500);
    })
    .catch(err => { console.error('Camera error', err); alert('Camera failed'); });
}
function setupAdvancedControls(track) {
  const cap = typeof track.getCapabilities === 'function' ? track.getCapabilities() : {};
  const set = typeof track.getSettings === 'function' ? track.getSettings() : {};
  if (cap.torch) torchBtn.disabled = false;
  else { torchBtn.disabled = true; isTorchOn = false; updateTorchUI(); }
  if (cap.focusMode && cap.focusMode.includes('manual') && cap.focusDistance) {
    focusMode.disabled = false;
    focusSlider.min = cap.focusDistance.min;
    focusSlider.max = cap.focusDistance.max;
    focusSlider.step = cap.focusDistance.step || 0.01;
    focusSlider.value = set.focusDistance || cap.focusDistance.min;
  } else { focusMode.disabled = true; focusSlider.disabled = true; }
  if (cap.exposureMode && cap.exposureMode.includes('manual') && cap.exposureTime) {
    exposureMode.disabled = false;
    exposureSlider.min = cap.exposureTime.min;
    exposureSlider.max = cap.exposureTime.max;
    exposureSlider.step = cap.exposureTime.step || 1;
    exposureSlider.value = set.exposureTime || cap.exposureTime.min;
  } else { exposureMode.disabled = true; exposureSlider.disabled = true; }
  if (cap.iso) {
    isoMode.disabled = false;
    isoSlider.min = cap.iso.min; isoSlider.max = cap.iso.max;
    isoSlider.step = cap.iso.step || 1;
    isoSlider.value = set.iso || cap.iso.min;
  } else { isoMode.disabled = true; isoSlider.disabled = true; }
}
async function applyCameraSettings() {
  if (!videoTrack) return;
  const adv = {};
  if (!torchBtn.disabled) adv.torch = isTorchOn;
  if (!focusMode.disabled) {
    adv.focusMode = focusMode.value;
    if (focusMode.value === 'manual') adv.focusDistance = parseFloat(focusSlider.value);
  }
  if (!exposureMode.disabled) {
    adv.exposureMode = exposureMode.value;
    if (exposureMode.value === 'manual') adv.exposureTime = parseFloat(exposureSlider.value);
  }
  if (!isoMode.disabled && isoMode.value === 'manual') adv.iso = parseFloat(isoSlider.value);
  if (Object.keys(adv).length && typeof videoTrack.applyConstraints === 'function') {
    try { await videoTrack.applyConstraints({ advanced: [adv] }); }
    catch (e) { console.warn('Error (Normal for Safari)', e); }
  }
}
function updateTorchUI() {
  torchBtn.innerText = `torch: ${isTorchOn ? 'ON' : 'OFF'}`;
  torchBtn.classList.toggle('active', isTorchOn);
}
torchBtn.addEventListener('click', () => { isTorchOn = !isTorchOn; updateTorchUI(); applyCameraSettings(); });
[focusMode, exposureMode, isoMode].forEach(el => {
  el.addEventListener('change', e => {
    e.target.nextElementSibling.disabled = (e.target.value !== 'manual');
    applyCameraSettings();
  });
});
[focusSlider, exposureSlider, isoSlider].forEach(el => el.addEventListener('input', applyCameraSettings));

startCamera();

listCamerasBtn.addEventListener('click', async () => {
  try {
    const devs = await navigator.mediaDevices.enumerateDevices();
    const vids = devs.filter(d => d.kind === 'videoinput');
    cameraSelect.innerHTML = '';
    vids.forEach((d, i) => {
      const o = document.createElement('option');
      o.value = d.deviceId; o.text = d.label || `Camera ${i+1}`;
      cameraSelect.appendChild(o);
    });
    cameraSelect.style.display = 'block';
    listCamerasBtn.style.display = 'none';
  } catch (e) { console.error(e); alert('Cameras failed to list'); }
});
cameraSelect.addEventListener('change', e => {
  startCamera(e.target.value);
  isTorchOn = false; updateTorchUI();
  [focusMode, exposureMode, isoMode].forEach(el => el.value = el.options[0].value);
  [focusSlider, exposureSlider, isoSlider].forEach(el => el.disabled = true);
});

/* ---------- CAPTURE -> PREVIEW ---------- */
captureBtn.addEventListener('click', () => {
  if (!currentStream) return;
  canvas.width = video.videoWidth;
  canvas.height = video.videoHeight;
  const ctx = canvas.getContext('2d');
  ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

  baseImageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
  const dataUrl = canvas.toDataURL('image/png');
  previewImage.src = dataUrl;
  currentPreviewDataUrl = dataUrl;
  originalPreviewDataUrl = dataUrl;

  resetPresetsUI();
  previewSection.style.display = 'block';
  aiPanel.style.display = 'none';
  presetsPanel.style.display = 'none';
  aiStatus.textContent = '';
  aiPrompt.value = '';
  window.scrollTo({ top: previewSection.offsetTop - 20, behavior: 'smooth' });
});

retakeBtn.addEventListener('click', () => {
  previewSection.style.display = 'none';
  currentPreviewDataUrl = null;
  originalPreviewDataUrl = null;
  baseImageData = null;
});

/* ---------- TOGGLES ---------- */
aiToggleBtn.addEventListener('click', () => {
  aiPanel.style.display = aiPanel.style.display === 'block' ? 'none' : 'block';
  presetsPanel.style.display = 'none';
});
presetsToggleBtn.addEventListener('click', () => {
  presetsPanel.style.display = presetsPanel.style.display === 'block' ? 'none' : 'block';
  aiPanel.style.display = 'none';
});
aiSubmitBtn.addEventListener('click', modifyWithAI);
applyPresetsBtn.addEventListener('click', applyPresets);
resetPresetsBtn.addEventListener('click', () => {
  resetPresetsUI();
  if (originalPreviewDataUrl) {
    previewImage.src = originalPreviewDataUrl;
    currentPreviewDataUrl = originalPreviewDataUrl;
  }
});

/* ---------- SAVE TO GALLERY ---------- */
saveGalleryBtn.addEventListener('click', async () => {
  if (!currentPreviewDataUrl) return;
  try {
    await addPhoto(currentPreviewDataUrl);
    saveGalleryBtn.textContent = 'saved ✓';
    setTimeout(() => saveGalleryBtn.textContent = 'save to gallery', 1500);
    renderGallery();
  } catch (e) {
    alert('save failed: ' + e.message);
  }
});

/* ---------- SETTINGS ---------- */
settingsBtn.addEventListener('click', () => {
  settingsPanel.style.display = settingsPanel.style.display === 'block' ? 'none' : 'block';
  apiKeyInput.value = localStorage.getItem('openai_key') || '';
  aiModelSelect.value = localStorage.getItem('ai_model') || 'gpt-image-1';
});
saveSettingsBtn.addEventListener('click', () => {
  localStorage.setItem('openai_key', apiKeyInput.value.trim());
  localStorage.setItem('ai_model', aiModelSelect.value);
  settingsPanel.style.display = 'none';
});
clearGalleryBtn.addEventListener('click', async () => {
  if (confirm('wipe the whole gallery?')) {
    await clearAllPhotos();
    renderGallery();
  }
});

/* ---------- INIT ---------- */
buildPresetRows();
(async () => {
  await openDB();
  renderGallery();
})();
</script>
</body>
</html>
